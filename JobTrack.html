/* =========================================
   JOBTRACK
   Script Shifters
   Main Stylesheet
========================================= */


/* =========================================
   ROOT VARIABLES
========================================= */

:root {

    --bg: #08080a;
    --bg-soft: #0d0d10;
    --surface: #111116;
    --surface-light: #17171e;

    --border: rgba(255, 255, 255, 0.09);
    --border-bright: rgba(255, 255, 255, 0.16);

    --text: #f3f1f7;
    --text-soft: #a6a3ad;
    --text-muted: #696771;

    --purple: #9b6cff;
    --purple-bright: #b28aff;
    --purple-dark: #633bb0;

    --white: #ffffff;

    --radius: 18px;

    --font-main: "Manrope", sans-serif;
    --font-mono: "DM Mono", monospace;
}


/* =========================================
   RESET
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-main);
    overflow-x: hidden;
}

a {
    text-decoration: none;
    color: inherit;
}

button,
input {
    font-family: inherit;
}


/* =========================================
   NAVIGATION
========================================= */

.navbar {
    width: 100%;
    height: 82px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 6vw;

    border-bottom: 1px solid var(--border);

    background: rgba(8, 8, 10, 0.82);

    backdrop-filter: blur(18px);

    position: sticky;
    top: 0;
    z-index: 100;
}


/* Logo */

.logo {
    display: flex;
    align-items: center;
    gap: 10px;

    font-weight: 800;
    letter-spacing: 1px;
}

.logo-mark {
    width: 32px;
    height: 32px;

    display: grid;
    place-items: center;

    border: 1px solid var(--purple);

    color: var(--purple-bright);

    font-family: var(--font-mono);

    box-shadow:
        0 0 18px rgba(155, 108, 255, 0.18);
}

.logo-text {
    font-size: 15px;
}

.logo-text span {
    color: var(--purple-bright);
}


/* Navigation */

.nav-links {
    display: flex;
    align-items: center;
    gap: 36px;

    margin-left: 80px;
}

.nav-links a {
    color: var(--text-muted);

    font-size: 13px;
    font-weight: 600;

    transition: 0.25s ease;
}

.nav-links a:hover,
.nav-links a.active {
    color: var(--text);
}


/* Right navigation */

.nav-actions {
    display: flex;
    align-items: center;
    gap: 24px;
}

.login-link {
    font-size: 13px;
    color: var(--text-soft);

    transition: 0.25s ease;
}

.login-link:hover {
    color: var(--white);
}

.nav-button {
    padding: 11px 18px;

    border: 1px solid var(--border-bright);

    background: rgba(255, 255, 255, 0.04);

    font-size: 12px;
    font-weight: 700;

    transition: 0.25s ease;
}

.nav-button:hover {
    border-color: var(--purple);
    background: rgba(155, 108, 255, 0.1);

    box-shadow:
        0 0 25px rgba(155, 108, 255, 0.12);
}


/* =========================================
   HERO
========================================= */

.hero {
    min-height: calc(100vh - 82px);

    display: grid;
    grid-template-columns: 1fr 1fr;

    align-items: center;

    padding: 80px 7vw;

    position: relative;
}


/* Left content */

.hero-content {
    max-width: 670px;

    position: relative;
    z-index: 2;
}

.eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 10px;
    letter-spacing: 2px;

    margin-bottom: 28px;
}

.status-dot,
.mini-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--purple);

    box-shadow:
        0 0 12px var(--purple);
}

.hero h1 {
    font-size: clamp(48px, 6vw, 86px);

    line-height: 0.98;

    letter-spacing: -4px;

    font-weight: 800;

    margin-bottom: 30px;
}

.hero h1 span {
    color: transparent;

    -webkit-text-stroke: 1px rgba(255, 255, 255, 0.45);

    text-shadow:
        0 0 35px rgba(155, 108, 255, 0.08);
}

.hero-description {
    max-width: 570px;

    color: var(--text-soft);

    font-size: 15px;

    line-height: 1.8;

    margin-bottom: 35px;
}


/* Hero buttons */

.hero-buttons {
    display: flex;
    gap: 14px;

    margin-bottom: 25px;
}

.primary-button {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 18px;

    padding: 15px 22px;

    background: var(--purple);

    color: #08080a;

    font-size: 12px;
    font-weight: 800;

    border: 1px solid var(--purple);

    transition: 0.3s ease;

    box-shadow:
        0 0 25px rgba(155, 108, 255, 0.16);
}

.primary-button span {
    font-size: 17px;

    transition: transform 0.3s ease;
}

.primary-button:hover {
    background: var(--purple-bright);

    box-shadow:
        0 0 40px rgba(155, 108, 255, 0.3);
}

.primary-button:hover span {
    transform: translateX(5px);
}

.secondary-button {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    padding: 15px 22px;

    border: 1px solid var(--border-bright);

    color: var(--text-soft);

    font-size: 12px;
    font-weight: 700;

    transition: 0.3s ease;
}

.secondary-button:hover {
    color: var(--white);

    border-color: rgba(155, 108, 255, 0.5);

    background: rgba(155, 108, 255, 0.05);
}

.hero-note {
    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 9px;

    letter-spacing: 0.5px;
}

.hero-note span {
    color: var(--purple);
}


/* =========================================
   HERO VISUAL
========================================= */

.hero-visual {
    height: 570px;

    position: relative;

    display: grid;
    place-items: center;

    overflow: hidden;
}


/* Grid */

.grid-background {
    position: absolute;

    inset: 0;

    opacity: 0.28;

    background-image:
        linear-gradient(
            rgba(255, 255, 255, 0.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.035) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    mask-image: radial-gradient(
        circle,
        black 10%,
        transparent 72%
    );
}


/* Glow */

.visual-glow {
    position: absolute;

    width: 380px;
    height: 380px;

    background: var(--purple);

    opacity: 0.07;

    filter: blur(100px);

    border-radius: 50%;
}


/* Orbit */

.career-orbit {
    width: 360px;
    height: 360px;

    position: relative;

    display: grid;
    place-items: center;
}


/* Rings */

.orbit-ring {
    position: absolute;

    border: 1px solid rgba(155, 108, 255, 0.25);

    border-radius: 50%;
}

.ring-one {
    width: 190px;
    height: 190px;

    animation: rotate 20s linear infinite;
}

.ring-two {
    width: 280px;
    height: 280px;

    border-style: dashed;

    opacity: 0.5;

    animation: rotate-reverse 30s linear infinite;
}

.ring-three {
    width: 350px;
    height: 350px;

    opacity: 0.2;

    animation: rotate 40s linear infinite;
}


/* Center */

.orbit-center {
    width: 125px;
    height: 125px;

    border-radius: 50%;

    border: 1px solid rgba(155, 108, 255, 0.6);

    background:
        radial-gradient(
            circle,
            rgba(155, 108, 255, 0.14),
            rgba(15, 15, 20, 0.95)
        );

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 7px;

    box-shadow:
        0 0 50px rgba(155, 108, 255, 0.12);

    z-index: 4;
}

.center-icon {
    font-family: var(--font-mono);

    font-size: 28px;

    color: var(--purple-bright);
}

.center-label {
    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 7px;

    letter-spacing: 1px;

    text-align: center;
}

.center-label strong {
    display: block;

    color: var(--purple-bright);

    margin-top: 3px;
}


/* Floating nodes */

.career-node {
    position: absolute;

    display: flex;
    align-items: center;

    gap: 10px;

    padding: 10px 13px;

    background: rgba(13, 13, 17, 0.9);

    border: 1px solid var(--border-bright);

    backdrop-filter: blur(10px);

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.4);

    z-index: 5;

    animation: float 5s ease-in-out infinite;
}

.career-node small {
    display: block;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 6px;

    letter-spacing: 1px;
}

.career-node strong {
    display: block;

    color: var(--text);

    font-size: 15px;

    margin-top: 3px;
}

.node-icon {
    width: 25px;
    height: 25px;

    display: grid;
    place-items: center;

    border: 1px solid rgba(155, 108, 255, 0.35);

    color: var(--purple-bright);

    font-size: 11px;
}

.node-one {
    top: 35px;
    right: 5px;
}

.node-two {
    left: -20px;
    top: 160px;

    animation-delay: -2s;
}

.node-three {
    bottom: 40px;
    right: 30px;

    animation-delay: -3.5s;
}


/* Floating labels */

.floating-label {
    position: absolute;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: 2px;
}

.label-top {
    top: 55px;
    left: 50px;

    display: flex;
    align-items: center;
    gap: 8px;
}

.label-bottom {
    bottom: 55px;
    right: 55px;
}


/* Connection lines */

.connection {
    position: absolute;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(155, 108, 255, 0.5),
            transparent
        );

    transform-origin: left center;

    opacity: 0.4;
}

.connection-one {
    width: 150px;

    top: 150px;
    right: 100px;

    transform: rotate(35deg);
}

.connection-two {
    width: 130px;

    top: 310px;
    left: 60px;

    transform: rotate(-25deg);
}

.connection-three {
    width: 120px;

    bottom: 120px;
    right: 120px;

    transform: rotate(-40deg);
}


/* =========================================
   STATS
========================================= */

.stats-section {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    margin: 0 7vw;

    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
}

.stat-item {
    padding: 28px 24px;

    border-right: 1px solid var(--border);
}

.stat-item:last-child {
    border-right: none;
}

.stat-number {
    display: block;

    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 18px;

    margin-bottom: 7px;
}

.stat-label {
    color: var(--text-muted);

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 1px;
}


/* =========================================
   GENERAL SECTION
========================================= */

.features-section,
.workflow-section {
    padding: 150px 7vw;
}

.section-heading {
    max-width: 650px;

    margin-bottom: 70px;
}

.section-tag {
    display: flex;

    align-items: center;

    gap: 12px;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 9px;

    letter-spacing: 2px;

    margin-bottom: 22px;
}

.section-tag span {
    color: var(--purple);
}

.section-heading h2 {
    font-size: clamp(38px, 5vw, 65px);

    line-height: 1;

    letter-spacing: -3px;

    margin-bottom: 22px;
}

.section-heading h2 span {
    color: var(--text-muted);
}

.section-heading p {
    color: var(--text-soft);

    font-size: 14px;

    line-height: 1.7;
}


/* =========================================
   FEATURES GRID
========================================= */

.feature-grid {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 1px;

    background: var(--border);

    border: 1px solid var(--border);
}

.feature-card {
    position: relative;

    min-height: 310px;

    padding: 35px;

    background: var(--bg);

    overflow: hidden;

    transition: 0.35s ease;
}

.feature-card:hover {
    background: var(--surface);

    transform: translateY(-4px);

    z-index: 2;
}

.feature-number {
    position: absolute;

    top: 25px;
    right: 28px;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 9px;
}

.feature-icon {
    width: 50px;
    height: 50px;

    display: grid;
    place-items: center;

    border: 1px solid rgba(155, 108, 255, 0.25);

    color: var(--purple-bright);

    font-size: 23px;

    margin-bottom: 50px;
}

.feature-card h3 {
    font-size: 19px;

    margin-bottom: 12px;
}

.feature-card p {
    color: var(--text-muted);

    font-size: 12px;

    line-height: 1.7;

    max-width: 330px;
}

.feature-line {
    position: absolute;

    left: 35px;
    bottom: 42px;

    width: 45px;
    height: 1px;

    background: var(--purple);
}

.feature-code {
    position: absolute;

    left: 95px;
    bottom: 36px;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 7px;

    letter-spacing: 1px;
}


/* =========================================
   WORKFLOW
========================================= */

.workflow {
    border-top: 1px solid var(--border);
}

.workflow-step {
    display: grid;

    grid-template-columns: 100px 1fr;

    padding: 45px 0;

    border-bottom: 1px solid var(--border);

    transition: 0.3s ease;
}

.workflow-step:hover {
    padding-left: 15px;
}

.step-number {
    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 12px;
}

.step-content > span {
    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: 2px;
}

.step-content h3 {
    font-size: 25px;

    margin: 8px 0;
}

.step-content p {
    color: var(--text-muted);

    font-size: 13px;

    max-width: 500px;

    line-height: 1.7;
}

.workflow-line {
    display: none;
}


/* =========================================
   CTA
========================================= */

.cta-section {
    margin: 0 7vw 100px;

    min-height: 450px;

    position: relative;

    display: grid;

    place-items: center;

    text-align: center;

    overflow: hidden;

    border: 1px solid var(--border);

    background:
        radial-gradient(
            circle at center,
            rgba(155, 108, 255, 0.08),
            transparent 60%
        );
}

.cta-glow {
    position: absolute;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    background: var(--purple);

    filter: blur(130px);

    opacity: 0.06;
}

.cta-content {
    position: relative;

    z-index: 2;
}

.cta-label {
    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: 3px;
}

.cta-content h2 {
    font-size: clamp(40px, 5vw, 70px);

    line-height: 1;

    letter-spacing: -3px;

    margin: 22px 0;
}

.cta-content h2 span {
    color: var(--text-muted);
}

.cta-content p {
    color: var(--text-soft);

    font-size: 13px;

    margin-bottom: 30px;
}


/* =========================================
   FOOTER
========================================= */

.footer {
    padding: 55px 7vw 25px;

    border-top: 1px solid var(--border);

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 50px;
}

.footer-brand p {
    color: var(--text-muted);

    font-size: 11px;

    margin-top: 12px;
}

.footer-info {
    display: flex;

    flex-direction: column;

    gap: 8px;

    align-items: flex-end;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 7px;

    letter-spacing: 1px;
}

.footer-bottom {
    grid-column: 1 / -1;

    padding-top: 25px;

    border-top: 1px solid var(--border);

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 8px;
}


/* =========================================
   ANIMATIONS
========================================= */

@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}

@keyframes rotate-reverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }

}

@keyframes float {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }

}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 1000px) {

    .nav-links {
        display: none;
    }

    .hero {
        grid-template-columns: 1fr;

        padding-top: 90px;
    }

    .hero-content {
        max-width: 800px;
    }

    .hero-visual {
        margin-top: 50px;
    }

    .feature-grid {
        grid-template-columns: repeat(2, 1fr);
    }

}


@media (max-width: 700px) {

    .navbar {
        padding: 0 5vw;
    }

    .nav-actions {
        gap: 10px;
    }

    .login-link {
        display: none;
    }

    .nav-button {
        padding: 9px 13px;
    }

    .hero {
        padding: 65px 5vw;
    }

    .hero h1 {
        font-size: 48px;

        letter-spacing: -2px;
    }

    .hero-description {
        font-size: 13px;
    }

    .hero-buttons {
        flex-direction: column;

        align-items: stretch;
    }

    .hero-visual {
        height: 430px;
    }

    .career-orbit {
        transform: scale(0.78);
    }

    .stats-section {
        grid-template-columns: repeat(2, 1fr);

        margin: 0 5vw;
    }

    .stat-item {
        border-bottom: 1px solid var(--border);
    }

    .features-section,
    .workflow-section {
        padding: 100px 5vw;
    }

    .feature-grid {
        grid-template-columns: 1fr;
    }

    .section-heading h2 {
        font-size: 42px;

        letter-spacing: -2px;
    }

    .workflow-step {
        grid-template-columns: 55px 1fr;
    }

    .cta-section {
        margin: 0 5vw 70px;
    }

    .footer {
        grid-template-columns: 1fr;

        padding: 45px 5vw 25px;
    }

    .footer-info {
        align-items: flex-start;
    }

}

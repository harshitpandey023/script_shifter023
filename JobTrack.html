           </button>\n\n        </div>\n\n\n    </aside>\n\n\n\n    <!-- =================================\n         MAIN CONTENT\n    ================================== -->\n\n    <main class=\"dashboard-main\">\n        <header class=\"dashboard-topbar\">\n            <span class=\"page-location\">JOBTRACK / ADMIN</span>\n            <div class=\"topbar-right\"><div class=\"system-indicator\"><span class=\"system-dot\"></span>SYSTEM ONLINE</div></div>\n        </header>\n        <section class=\"dashboard-welcome\"><span class=\"welcome-label\">ADMIN CONSOLE</span><h1>SYSTEM OVERVIEW</h1>\n        <p>Admin accounts can see every registered user and the recent activity log.</p></section>\n        <section class=\"dashboard-stats\">\n            <div class=\"stat-card\"><span class=\"stat-label\">USERS</span><span class=\"stat-number\" id=\"aUsers\">00</span><span class=\"stat-index\">01</span></div>\n            <div class=\"stat-card\"><span class=\"stat-label\">APPLICATIONS</span><span class=\"stat-number\" id=\"aApps\">00</span><span class=\"stat-index\">02</span></div>\n            <div class=\"stat-card\"><span class=\"stat-label\">ACTIVITIES</span><span class=\"stat-number\" id=\"aActs\">00</span><span class=\"stat-index\">03</span></div>\n            <div class=\"stat-card\"><span class=\"stat-label\">SAVED JOBS</span><span class=\"stat-number\" id=\"aSaved\">00</span><span class=\"stat-index\">04</span></div>\n        </section>\n        <div class=\"dashboard-panel\"><div class=\"panel-header\"><span class=\"panel-title\">REGISTERED USERS</span></div>\n            <div class=\"table-wrap\"><table class=\"page-table\"><thead><tr><th>NAME</th><th>EMAIL</th><th>ROLE</th><th>PROGRAMME</th></tr></thead><tbody id=\"userRows\"></tbody></table></div></div>\n        <div class=\"dashboard-panel\"><div class=\"panel-header\"><span class=\"panel-title\">RECENT ACTIVITY</span></div>\n            <ul id=\"actList\" class=\"page-list\"></ul></div>\n    </main>\n    \n    \n    \n"};
const SCRIPTS={"storage":"\n/* =========================================\n   JOBTRACK STORAGE SYSTEM\n   Script Shifters / K3P26RE\n\n   Uses browser localStorage for persistent\n   demo/project data.\n========================================= */\n\n\n/* =========================================\n   STORAGE KEYS\n========================================= */\n\nconst STORAGE_KEYS = {\n    USERS: \"jobtrack_users\",\n    CURRENT_USER: \"jobtrack_current_user\",\n    PROFILE: \"jobtrack_profile\",\n    APPLICATIONS: \"jobtrack_applications\",\n    ACTIVITIES: \"jobtrack_activities\",\n    SAVED_JOBS: \"jobtrack_saved_jobs\"\n};\n\n\n/* =========================================\n   GENERIC STORAGE FUNCTIONS\n========================================= */\n\nfunction getStoredData(key, defaultValue = []) {\n    try {\n        const data = localStorage.getItem(key);\n\n        if (data === null) {\n            return defaultValue;\n        }\n\n        return JSON.parse(data);\n\n    } catch (error) {\n        console.error(\"Storage read error:\", error);\n        return defaultValue;\n    }\n}\n\n\nfunction setStoredData(key, data) {\n    try {\n        localStorage.setItem(key, JSON.stringify(data));\n        return true;\n\n    } catch (error) {\n        console.error(\"Storage write error:\", error);\n        return false;\n    }\n}\n\n\nfunction removeStoredData(key) {\n    try {\n        localStorage.removeItem(key);\n        return true;\n\n    } catch (error) {\n        console.error(\"Storage removal error:\", error);\n        return false;\n    }\n}\n\n\n/* =========================================\n   UNIQUE ID GENERATOR\n========================================= */\n\nfunction generateId(prefix) {\n    let uniquePart;\n\n    if (\n        typeof crypto !== \"undefined\" &&\n        typeof crypto.randomUUID === \"function\"\n    ) {\n        uniquePart = crypto.randomUUID();\n\n    } else {\n        uniquePart =\n            Date.now() + \"-\" +\n            Math.random().toString(36).slice(2, 10);\n    }\n\n    return prefix + \"-\" + uniquePart;\n}\n\n\n/* =========================================\n   USER ACCOUNTS\n========================================= */\n\nfunction seedDemoUsers() {\n    const demoUsers = [\n        {\n            id: \"USR001\",\n            name: \"Alex Morgan\",\n            email: \"alex@jobtrack.demo\",\n            password: \"Demo@123\",\n            role: \"student\",\n            studentId: \"\",\n            programme: \"B.Tech Computer Science and Engineering\",\n            year: \"2028\"\n        },\n        {\n            id: \"ADM001\",\n            name: \"JobTrack Admin\",\n            email: \"admin@jobtrack.demo\",\n            password: \"Admin@123\",\n            role: \"admin\",\n            studentId: \"\",\n            programme: \"Administration\",\n            year: \"\"\n        }\n    ];\n\n    const users = getUsers();\n    let changed = false;\n\n    demoUsers.forEach(demoUser => {\n        const exists = users.some(user =>\n            user.email &&\n            user.email.toLowerCase() === demoUser.email.toLowerCase()\n        );\n\n        if (!exists) {\n            users.push(demoUser);\n            changed = true;\n        }\n    });\n\n    if (changed || !localStorage.getItem(STORAGE_KEYS.USERS)) {\n        saveUsers(users);\n    }\n\n    return users;\n}\n\n\nfunction getUsers() {\n    const users = getStoredData(STORAGE_KEYS.USERS, []);\n    return Array.isArray(users) ? users : [];\n}\n\n\nfunction saveUsers(users) {\n    return setStoredData(STORAGE_KEYS.USERS, users);\n}\n\n\nfunction findUserByEmail(email) {\n    if (!email) return undefined;\n\n    const users = getUsers();\n\n    return users.find(user =>\n        user.email &&\n        user.email.toLowerCase() === email.trim().toLowerCase()\n    );\n}\n\n\nfunction createUser(userData) {\n    if (\n        !userData ||\n        !userData.name ||\n        !userData.email ||\n        !userData.password\n    ) {\n        return {\n            success: false,\n            message: \"Please provide all required account details.\"\n        };\n    }\n\n    const users = getUsers();\n    const existingUser = findUserByEmail(userData.email);\n\n    if (existingUser) {\n        return {\n            success: false,\n            message: \"An account with this email already exists.\"\n        };\n    }\n\n    const newUser = {\n        id: generateId(\"USR\"),\n        name: userData.name.trim(),\n        email: userData.email.trim().toLowerCase(),\n        password: userData.password,\n        studentId: userData.studentId || \"\",\n        programme: userData.programme || \"\",\n        year: userData.year || \"\",\n        role: \"student\",\n        createdAt: new Date().toISOString()\n    };\n\n    users.push(newUser);\n\n    const saved = saveUsers(users);\n\n    if (!saved) {\n        return {\n            success: false,\n            message: \"Unable to create your account. Please try again.\"\n        };\n    }\n\n    return {\n        success: true,\n        user: newUser\n    };\n}\n\n\n/* =========================================\n   CURRENT USER\n========================================= */\n\nfunction setCurrentUser(user) {\n    if (!user || !user.id) {\n        return null;\n    }\n\n    const safeUser = {\n        id: user.id,\n        name: user.name,\n        email: user.email,\n        studentId: user.studentId || \"\",\n        programme: user.programme || \"\",\n        year: user.year || \"\",\n        role: user.role || \"student\"\n    };\n\n    const saved = setStoredData(\n        STORAGE_KEYS.CURRENT_USER,\n        safeUser\n    );\n\n    return saved ? safeUser : null;\n}\n\n\nfunction getCurrentUser() {\n    return getStoredData(STORAGE_KEYS.CURRENT_USER, null);\n}\n\n\nfunction isLoggedIn() {\n    return getCurrentUser() !== null;\n}\n\n\nfunction logoutUser() {\n    removeStoredData(STORAGE_KEYS.CURRENT_USER);\n}\n\n\n/* =========================================\n   PROFILE \u2014 USER SPECIFIC\n========================================= */\n\nfunction getProfile() {\n    const currentUser = getCurrentUser();\n\n    if (!currentUser) {\n        return null;\n    }\n\n    const profiles = getStoredData(STORAGE_KEYS.PROFILE, {});\n\n    if (\n        !profiles ||\n        typeof profiles !== \"object\" ||\n        Array.isArray(profiles)\n    ) {\n        return null;\n    }\n\n    return profiles[currentUser.id] || null;\n}\n\n\nfunction saveProfile(profile) {\n    const currentUser = getCurrentUser();\n\n    if (\n        !currentUser ||\n        !profile ||\n        typeof profile !== \"object\" ||\n        Array.isArray(profile)\n    ) {\n        return false;\n    }\n\n    const profiles = getStoredData(STORAGE_KEYS.PROFILE, {});\n\n    const allProfiles =\n        profiles &&\n        typeof profiles === \"object\" &&\n        !Array.isArray(profiles)\n            ? profiles\n            : {};\n\n    allProfiles[currentUser.id] = profile;\n\n    return setStoredData(\n        STORAGE_KEYS.PROFILE,\n        allProfiles\n    );\n}\n\n\n/* =========================================\n   APPLICATIONS\n========================================= */\n\nfunction getApplications() {\n    const applications = getStoredData(\n        STORAGE_KEYS.APPLICATIONS,\n        []\n    );\n\n    return Array.isArray(applications) ? applications : [];\n}\n\n\nfunction saveApplications(applications) {\n    if (!Array.isArray(applications)) {\n        return false;\n    }\n\n    return setStoredData(\n        STORAGE_KEYS.APPLICATIONS,\n        applications\n    );\n}\n\n\nfunction addApplication(application) {\n    if (!application || !application.userId) {\n        console.error(\"Application must belong to a user.\");\n        return null;\n    }\n\n    const applications = getApplications();\n\n    const newApplication = {\n        ...application,\n        id: generateId(\"APP\"),\n        createdAt: new Date().toISOString()\n    };\n\n    applications.push(newApplication);\n\n    const saved = saveApplications(applications);\n\n    if (!saved) {\n        return null;\n    }\n\n    return newApplication;\n}\n\n\n/* =========================================\n   ACTIVITIES\n========================================= */\n\nfunction getActivities() {\n    const activities = getStoredData(\n        STORAGE_KEYS.ACTIVITIES,\n        []\n    );\n\n    return Array.isArray(activities) ? activities : [];\n}\n\n\nfunction saveActivities(activities) {\n    if (!Array.isArray(activities)) {\n        return false;\n    }\n\n    return setStoredData(\n        STORAGE_KEYS.ACTIVITIES,\n        activities\n    );\n}\n\n\nfunction addActivity(activity) {\n    if (!activity) {\n        return null;\n    }\n\n    const activities = getActivities();\n\n    const newActivity = {\n        ...activity,\n        id: generateId(\"ACT\"),\n        createdAt: new Date().toISOString()\n    };\n\n    activities.push(newActivity);\n\n    const saved = saveActivities(activities);\n\n    if (!saved) {\n        return null;\n    }\n\n    return newActivity;\n}\n\n\n/* =========================================\n   SAVED JOBS \u2014 USER SPECIFIC\n========================================= */\n\nfunction getSavedJobs() {\n    const storedData = getStoredData(\n        STORAGE_KEYS.SAVED_JOBS,\n        {}\n    );\n\n    const currentUser = getCurrentUser();\n\n    if (!currentUser) {\n        return [];\n    }\n\n    // Do not assign old global saved jobs\n    // to an arbitrary user's account.\n    if (Array.isArray(storedData)) {\n        return [];\n    }\n\n    if (\n        !storedData ||\n        typeof storedData !== \"object\"\n    ) {\n        return [];\n    }\n\n    const userSavedJobs = storedData[currentUser.id];\n\n    return Array.isArray(userSavedJobs)\n        ? userSavedJobs\n        : [];\n}\n\n\nfunction saveJobs(jobs) {\n    if (!Array.isArray(jobs)) {\n        return false;\n    }\n\n    const currentUser = getCurrentUser();\n\n    if (!currentUser) {\n        return false;\n    }\n\n    let storedData = getStoredData(\n        STORAGE_KEYS.SAVED_JOBS,\n        {}\n    );\n\n    if (Array.isArray(storedData)) {\n        storedData = {};\n    }\n\n    if (\n        !storedData ||\n        typeof storedData !== \"object\"\n    ) {\n        storedData = {};\n    }\n\n    storedData[currentUser.id] = jobs;\n\n    return setStoredData(\n        STORAGE_KEYS.SAVED_JOBS,\n        storedData\n    );\n}\n\n\n/* =========================================\n   TOGGLE SAVED JOB\n========================================= */\n\nfunction toggleSavedJob(jobId) {\n    if (!jobId) {\n        return false;\n    }\n\n    const savedJobs = getSavedJobs();\n    const index = savedJobs.indexOf(jobId);\n\n    // Add job\n    if (index === -1) {\n        savedJobs.push(jobId);\n\n        if (!saveJobs(savedJobs)) {\n            return false;\n        }\n\n        return true;\n    }\n\n    // Remove job\n    savedJobs.splice(index, 1);\n\n    if (!saveJobs(savedJobs)) {\n        return true;\n    }\n\n    return false;\n}\n\n\nfunction isJobSaved(jobId) {\n    return getSavedJobs().includes(jobId);\n}\n\n\n/* =========================================\n   TOTAL SAVED JOBS \u2014 ALL USERS\n========================================= */\n\nfunction getTotalSavedJobs() {\n    const storedData = getStoredData(\n        STORAGE_KEYS.SAVED_JOBS,\n        {}\n    );\n\n    if (Array.isArray(storedData)) {\n        return storedData.length;\n    }\n\n    if (\n        !storedData ||\n        typeof storedData !== \"object\"\n    ) {\n        return 0;\n    }\n\n    return Object.values(storedData).reduce(\n        (total, jobs) => {\n            return total + (\n                Array.isArray(jobs) ? jobs.length : 0\n            );\n        },\n        0\n    );\n}\n","guard":"/* JobTrack guard: protects pages and handles logout. */\n\n(function () {\n\n    const user = getCurrentUser();\n\n    // Redirect users who are not logged in.\n    if (!user) {\n        window.location.href = \"#login\";\n        return;\n    }\n\n    document.addEventListener(\"DOMContentLoaded\", () => {\n\n        // Display the user's first name, if the element exists.\n        const nameEl = document.getElementById(\"userName\");\n\n        if (nameEl) {\n            nameEl.textContent =\n                (user.name || \"USER\").split(\" \")[0].toUpperCase() + \".\";\n        }\n\n        // Logout functionality.\n        const logoutButton = document.getElementById(\"logoutButton\");\n\n        if (logoutButton && !logoutButton.dataset.bound) {\n\n            logoutButton.dataset.bound = \"true\";\n\n            logoutButton.addEventListener(\"click\", () => {\n                logoutUser();\n                window.location.href = \"#login\";\n            });\n\n        }\n\n    });\n\n})();","script":"/* =========================================\n   JOBTRACK\n   Main JavaScript\n========================================= */\n\ndocument.addEventListener(\"DOMContentLoaded\", () => {\n\n    console.log(\"JobTrack initialized.\");\n\n    /* =====================================\n       SMOOTH SCROLLING\n    ===================================== */\n\n    const navLinks = document.querySelectorAll('a[href^=\"#\"]');\n\n    navLinks.forEach(link => {\n\n        link.addEventListener(\"click\", function (event) {\n\n            const targetId = this.getAttribute(\"href\");\n\n            if (targetId === \"#\") {\n                return;\n            }\n\n            const target = document.querySelector(targetId);\n\n            if (target) {\n\n                event.preventDefault();\n\n                target.scrollIntoView({\n                    behavior: \"smooth\",\n                    block: \"start\"\n                });\n\n            }\n\n        });\n\n    });\n\n\n    /* =====================================\n       ACTIVE NAVIGATION\n    ===================================== */\n\n    const sections = document.querySelectorAll(\"section[id]\");\n    const navigationLinks = document.querySelectorAll(\".nav-links a\");\n\n    window.addEventListener(\"scroll\", () => {\n\n        let currentSection = \"\";\n\n        sections.forEach(section => {\n\n            const sectionTop = section.offsetTop - 150;\n            const sectionHeight = section.offsetHeight;\n\n            if (\n                window.scrollY >= sectionTop &&\n                window.scrollY < sectionTop + sectionHeight\n            ) {\n\n                currentSection = section.getAttribute(\"id\");\n\n            }\n\n        });\n\n        navigationLinks.forEach(link => {\n\n            link.classList.remove(\"active\");\n\n            if (\n                link.getAttribute(\"href\") === `#${currentSection}`\n            ) {\n\n                link.classList.add(\"active\");\n\n            }\n\n        });\n\n    });\n\n\n    /* =====================================\n       INTERSECTION ANIMATION\n    ===================================== */\n\n    const animatedElements = document.querySelectorAll(\n        \".feature-card, .workflow-step, .stat-item\"\n    );\n\n    const observer = new IntersectionObserver(\n        entries => {\n\n            entries.forEach(entry => {\n\n                if (entry.isIntersecting) {\n\n                    entry.target.style.opacity = \"1\";\n                    entry.target.style.transform = \"translateY(0)\";\n\n                    observer.unobserve(entry.target);\n\n                }\n\n            });\n\n        },\n        {\n            threshold: 0.15\n        }\n    );\n\n\n    animatedElements.forEach(element => {\n\n        element.style.opacity = \"0\";\n        element.style.transform = \"translateY(20px)\";\n        element.style.transition = \"opacity 0.6s ease, transform 0.6s ease\";\n\n        observer.observe(element);\n\n    });\n\n});","auth":"\n/* =========================================\n   JOBTRACK AUTHENTICATION\n   Script Shifters / K3P26RE\n\n   Educational demo only: credentials are\n   stored in browser localStorage, not secure\n   enough for a production application.\n========================================= */\n\ndocument.addEventListener(\"DOMContentLoaded\", () => {\n\n    /* =================================\n       SEED DEMO ACCOUNTS\n    ================================= */\n\n    seedDemoUsers();\n\n\n    /* =================================\n       GET HTML ELEMENTS\n    ================================= */\n\n    const loginForm = document.getElementById(\"loginForm\");\n    const emailInput = document.getElementById(\"email\");\n    const passwordInput = document.getElementById(\"password\");\n    const togglePassword = document.getElementById(\"togglePassword\");\n    const message = document.getElementById(\"loginMessage\");\n\n\n    /* =================================\n       SHOW / HIDE PASSWORD\n    ================================= */\n\n    if (togglePassword && passwordInput) {\n\n        togglePassword.addEventListener(\"click\", () => {\n\n            const showing = passwordInput.type === \"password\";\n\n            passwordInput.type = showing ? \"text\" : \"password\";\n\n            togglePassword.textContent =\n                showing ? \"HIDE\" : \"SHOW\";\n\n        });\n\n    }\n\n\n    /* =================================\n       LOGIN FORM\n    ================================= */\n\n    if (!loginForm) return;\n\n    loginForm.addEventListener(\"submit\", event => {\n\n        event.preventDefault();\n\n        if (message) {\n            message.textContent = \"\";\n        }\n\n        const email = emailInput\n            ? emailInput.value.trim().toLowerCase()\n            : \"\";\n\n        const password = passwordInput\n            ? passwordInput.value\n            : \"\";\n\n\n        /* =================================\n           VALIDATION\n        ================================= */\n\n        if (!email || !password) {\n\n            showMessage(\n                \"ERROR / Please complete all fields.\",\n                \"error\"\n            );\n\n            return;\n\n        }\n\n\n        /* =================================\n           CHECK CREDENTIALS\n        ================================= */\n\n        const user = findUserByEmail(email);\n\n        if (!user || user.password !== password) {\n\n            showMessage(\n                \"ERROR / Incorrect email or password.\",\n                \"error\"\n            );\n\n            return;\n\n        }\n\n\n        /* =================================\n           CREATE LOGIN SESSION\n        ================================= */\n\n        const session = setCurrentUser(user);\n\n        if (!session) {\n\n            showMessage(\n                \"ERROR / Unable to create login session. Please try again.\",\n                \"error\"\n            );\n\n            return;\n\n        }\n\n\n        /* =================================\n           RECORD LOGIN ACTIVITY\n        ================================= */\n\n        addActivity({\n\n            userId: user.id,\n\n            type: \"login\",\n\n            message: `${user.name} logged in.`\n\n        });\n\n\n        /* =================================\n           SUCCESS & REDIRECT\n        ================================= */\n\n        showMessage(\n            \"SUCCESS / Access granted. Redirecting...\",\n            \"success\"\n        );\n\n        window.location.href =\n            user.role === \"admin\"\n                ? \"#admin\"\n                : \"#dashboard\";\n\n    });\n\n\n    /* =================================\n       MESSAGE HELPER\n    ================================= */\n\n    function showMessage(text, type) {\n\n        if (!message) return;\n\n        message.textContent = text;\n\n        message.style.color =\n            type === \"success\"\n                ? \"#9b6cff\"\n                : \"#ff7777\";\n\n    }\n\n});\n","register":"\n/* =========================================\n   JOBTRACK REGISTRATION\n   Script Shifters / K3P26RE\n========================================= */\n\ndocument.addEventListener(\"DOMContentLoaded\", () => {\n\n    // Add demo accounts if they do not already exist.\n    seedDemoUsers();\n\n    const form = document.getElementById(\"registerForm\");\n    const password = document.getElementById(\"password\");\n    const confirmPassword = document.getElementById(\"confirmPassword\");\n    const togglePassword = document.getElementById(\"toggleRegisterPassword\");\n    const message = document.getElementById(\"registerMessage\");\n    const terms = document.getElementById(\"terms\");\n\n    /* =================================\n       SHOW / HIDE PASSWORD\n    ================================= */\n\n    if (togglePassword && password) {\n\n        togglePassword.addEventListener(\"click\", () => {\n\n            const showing = password.type === \"password\";\n\n            password.type = showing ? \"text\" : \"password\";\n\n            togglePassword.textContent =\n                showing ? \"HIDE\" : \"SHOW\";\n\n        });\n\n    }\n\n    if (!form) return;\n\n    /* =================================\n       REGISTRATION FORM\n    ================================= */\n\n    form.addEventListener(\"submit\", event => {\n\n        event.preventDefault();\n\n        if (message) {\n            message.textContent = \"\";\n        }\n\n        if (!password || !confirmPassword || !terms) {\n            showMessage(\n                \"ERROR / Registration form is missing required fields.\",\n                \"error\"\n            );\n            return;\n        }\n\n        const formData = new FormData(form);\n\n        const name = String(formData.get(\"name\") || \"\").trim();\n        const email = String(formData.get(\"email\") || \"\").trim().toLowerCase();\n        const studentId = String(formData.get(\"studentId\") || \"\").trim();\n        const year = String(formData.get(\"year\") || \"\").trim();\n        const programme = String(formData.get(\"programme\") || \"\").trim();\n        const passwordValue = password.value;\n\n        /* =================================\n           REQUIRED FIELD VALIDATION\n        ================================= */\n\n        if (\n            !name ||\n            !email ||\n            !studentId ||\n            !year ||\n            !programme ||\n            !passwordValue\n        ) {\n            showMessage(\n                \"ERROR / Please complete all required fields.\",\n                \"error\"\n            );\n            return;\n        }\n\n        /* =================================\n           EMAIL VALIDATION\n        ================================= */\n\n        const emailPattern = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\n\n        if (!emailPattern.test(email)) {\n            showMessage(\n                \"ERROR / Please enter a valid email address.\",\n                \"error\"\n            );\n            return;\n        }\n\n        /* =================================\n           PASSWORD VALIDATION\n        ================================= */\n\n        if (passwordValue.length < 8) {\n            showMessage(\n                \"ERROR / Password must contain at least 8 characters.\",\n                \"error\"\n            );\n            password.focus();\n            return;\n        }\n\n        if (passwordValue !== confirmPassword.value) {\n            showMessage(\n                \"ERROR / Your passwords do not match.\",\n                \"error\"\n            );\n            confirmPassword.focus();\n            return;\n        }\n\n        /* =================================\n           TERMS VALIDATION\n        ================================= */\n\n        if (!terms.checked) {\n            showMessage(\n                \"ERROR / Please accept the terms to continue.\",\n                \"error\"\n            );\n            return;\n        }\n\n        /* =================================\n           CREATE STUDENT ACCOUNT\n        ================================= */\n\n        const result = createUser({\n            name,\n            email,\n            studentId,\n            year,\n            programme,\n            password: passwordValue\n        });\n\n        if (!result || !result.success) {\n            showMessage(\n                `ERROR / ${result?.message || \"Account creation failed. Please try again.\"}`,\n                \"error\"\n            );\n            return;\n        }\n\n        /* =================================\n           CREATE LOGIN SESSION\n        ================================= */\n\n        const session = setCurrentUser(result.user);\n\n        if (!session) {\n            showMessage(\n                \"ERROR / Account created, but login could not be started. Please log in.\",\n                \"error\"\n            );\n            return;\n        }\n\n        /* =================================\n           RECORD REGISTRATION ACTIVITY\n        ================================= */\n\n        addActivity({\n            userId: result.user.id,\n            type: \"registration\",\n            message: `${result.user.name} created an account.`\n        });\n\n        /* =================================\n           SUCCESS & REDIRECT\n        ================================= */\n\n        showMessage(\n            \"SUCCESS / Account created. Opening your workspace...\",\n            \"success\"\n        );\n\n        form.reset();\n\n        window.location.href = \"#dashboard\";\n\n    });\n\n    /* =================================\n       MESSAGE HELPER\n    ================================= */\n\n    function showMessage(text, type) {\n\n        if (!message) return;\n\n        message.textContent = text;\n\n        message.style.color =\n            type === \"success\"\n                ? \"#9b6cff\"\n                : \"#ff7777\";\n\n    }\n\n});\n","dashboard":"\n/* =========================================\n   JOBTRACK DASHBOARD\n   Script Shifters / K3P26RE\n========================================= */\n\ndocument.addEventListener(\"DOMContentLoaded\", () => {\n\n    /* =================================\n       CHECK LOGIN\n    ================================= */\n\n    const currentUser = getCurrentUser();\n\n    if (!currentUser) {\n        window.location.href = \"#login\";\n        return;\n    }\n\n\n    /* =================================\n       GET USER APPLICATIONS\n    ================================= */\n\n    const allApplications = getApplications();\n\n    const userApplications = allApplications.filter(application => {\n\n        if (application.userId) {\n            return application.userId === currentUser.id;\n        }\n\n        return (\n            application.applicantEmail &&\n            application.applicantEmail.toLowerCase() ===\n            currentUser.email.toLowerCase()\n        );\n\n    });\n\n\n    /* =================================\n       GET SAVED JOBS\n    ================================= */\n\n    // getSavedJobs() returns saved jobs\n    // belonging to the currently logged-in user.\n    const savedJobs = getSavedJobs();\n\n    const totalSaved = savedJobs.length;\n\n\n    /* =================================\n       NORMALIZE APPLICATION STATUS\n    ================================= */\n\n    const allowedStatuses = [\n        \"Applied\",\n        \"Assessment\",\n        \"Interview\",\n        \"Offer\",\n        \"Rejected\"\n    ];\n\n    function getApplicationStatus(application) {\n\n        return allowedStatuses.includes(application.status)\n            ? application.status\n            : \"Applied\";\n\n    }\n\n\n    /* =================================\n       CALCULATE STATISTICS\n    ================================= */\n\n    const totalApplications = userApplications.length;\n\n    const totalInterviews = userApplications.filter(\n        application =>\n            getApplicationStatus(application) === \"Interview\"\n    ).length;\n\n    const totalOffers = userApplications.filter(\n        application =>\n            getApplicationStatus(application) === \"Offer\"\n    ).length;\n\n    const totalApplied = userApplications.filter(\n        application =>\n            getApplicationStatus(application) === \"Applied\"\n    ).length;\n\n    const totalRejected = userApplications.filter(\n        application =>\n            getApplicationStatus(application) === \"Rejected\"\n    ).length;\n\n\n    /* =================================\n       UPDATE COUNTERS\n    ================================= */\n\n    function updateCounter(elementId, value) {\n\n        const element = document.getElementById(elementId);\n\n        if (element) {\n            element.textContent =\n                String(value).padStart(2, \"0\");\n        }\n\n    }\n\n    updateCounter(\"totalApplications\", totalApplications);\n    updateCounter(\"totalInterviews\", totalInterviews);\n    updateCounter(\"totalOffers\", totalOffers);\n    updateCounter(\"totalSaved\", totalSaved);\n\n    // Application pipeline\n    updateCounter(\"appliedCount\", totalApplied);\n    updateCounter(\"interviewCount\", totalInterviews);\n    updateCounter(\"offerCount\", totalOffers);\n    updateCounter(\"rejectedCount\", totalRejected);\n\n\n    /* =================================\n       UPDATE WELCOME MESSAGE\n    ================================= */\n\n    const welcomeElement =\n        document.getElementById(\"userName\");\n\n    if (welcomeElement) {\n\n        const firstName = (currentUser.name || \"STUDENT\")\n            .trim()\n            .split(/\\s+/)[0];\n\n        welcomeElement.textContent =\n            firstName.toUpperCase() + \".\";\n\n    }\n\n\n    /* =================================\n       RECENT APPLICATIONS\n    ================================= */\n\n    const recentApplicationsElement =\n        document.getElementById(\"recentApplications\");\n\n    if (recentApplicationsElement) {\n\n        const recentApplications = [...userApplications]\n            .sort((a, b) =>\n                new Date(b.createdAt || b.appliedDate || 0) -\n                new Date(a.createdAt || a.appliedDate || 0)\n            )\n            .slice(0, 5);\n\n        if (recentApplications.length === 0) {\n\n            recentApplicationsElement.innerHTML = `\n                <div class=\"empty-state\">\n                    NO APPLICATIONS RECORDED\n                </div>\n            `;\n\n        } else {\n\n            recentApplicationsElement.innerHTML =\n                recentApplications.map(application => {\n\n                    const company = escapeDashboardHTML(\n                        application.company || \"Unknown Company\"\n                    );\n\n                    const role = escapeDashboardHTML(\n                        application.role ||\n                        application.title ||\n                        \"Untitled Role\"\n                    );\n\n                    const status = escapeDashboardHTML(\n                        getApplicationStatus(application)\n                    );\n\n                    let date = \"NO DATE\";\n\n                    if (application.appliedDate) {\n\n                        const parsedDate = new Date(\n                            application.appliedDate + \"T00:00:00\"\n                        );\n\n                        if (!Number.isNaN(parsedDate.getTime())) {\n                            date = parsedDate.toLocaleDateString(\n                                \"en-IN\",\n                                {\n                                    day: \"2-digit\",\n                                    month: \"short\"\n                                }\n                            );\n                        }\n\n                    } else if (application.createdAt) {\n\n                        const parsedDate =\n                            new Date(application.createdAt);\n\n                        if (!Number.isNaN(parsedDate.getTime())) {\n                            date = parsedDate.toLocaleDateString(\n                                \"en-IN\",\n                                {\n                                    day: \"2-digit\",\n                                    month: \"short\"\n                                }\n                            );\n                        }\n\n                    }\n\n                    return `\n                        <div class=\"application-item\">\n\n                            <div class=\"application-info\">\n                                <strong>${role}</strong>\n                                <span>${company}</span>\n                            </div>\n\n                            <div class=\"application-meta\">\n                                <span class=\"application-status\">\n                                    ${status}\n                                </span>\n                                <small>${escapeDashboardHTML(date)}</small>\n                            </div>\n\n                        </div>\n                    `;\n\n                }).join(\"\");\n\n        }\n\n    }\n\n\n    /* =================================\n       RECENT ACTIVITY\n    ================================= */\n\n    const recentActivityElement =\n        document.getElementById(\"recentActivity\");\n\n    if (recentActivityElement) {\n\n        const activities = getActivities();\n\n        // Show only activity belonging to this user.\n        const userActivities = activities\n            .filter(activity =>\n                activity.userId === currentUser.id\n            )\n            .sort((a, b) =>\n                new Date(b.createdAt || 0) -\n                new Date(a.createdAt || 0)\n            )\n            .slice(0, 5);\n\n        if (userActivities.length === 0) {\n\n            recentActivityElement.innerHTML = `\n                <div class=\"empty-state\">\n                    NO RECENT ACTIVITY\n                </div>\n            `;\n\n        } else {\n\n            recentActivityElement.innerHTML =\n                userActivities.map(activity => {\n\n                    const message = escapeDashboardHTML(\n                        activity.message || \"Activity recorded\"\n                    );\n\n                    let date = \"\";\n\n                    if (activity.createdAt) {\n\n                        const parsedDate =\n                            new Date(activity.createdAt);\n\n                        if (!Number.isNaN(parsedDate.getTime())) {\n                            date = parsedDate.toLocaleString(\n                                \"en-IN\",\n                                {\n                                    day: \"2-digit\",\n                                    month: \"short\",\n                                    hour: \"2-digit\",\n                                    minute: \"2-digit\"\n                                }\n                            );\n                        }\n\n                    }\n\n                    return `\n                        <div class=\"activity-item\">\n                            <span class=\"activity-message\">\n                                ${message}\n                            </span>\n                            <small>${escapeDashboardHTML(date)}</small>\n                        </div>\n                    `;\n\n                }).join(\"\");\n\n        }\n\n    }\n\n});\n\n\n/* =========================================\n   SAFE HTML HELPER\n========================================= */\n\nfunction escapeDashboardHTML(value) {\n\n    return String(value ?? \"\").replace(/[&<>\"']/g, char => ({\n        \"&\": \"&amp;\",\n        \"<\": \"&lt;\",\n        \">\": \"&gt;\",\n        '\"': \"&quot;\",\n        \"'\": \"&#39;\"\n    })[char]);\n\n}\n","jobs":"\n/* =========================================\n   JOBTRACK \u2014 JOB DISCOVERY SYSTEM\n   Script Shifters / K3P26RE\n========================================= */\n\n\n/* =========================================\n   GLOBAL DATA\n========================================= */\n\nlet allJobs = [];\nlet filteredJobs = [];\n\n\n/* =========================================\n   DOM ELEMENTS\n========================================= */\n\nconst jobsGrid = document.getElementById(\"jobsGrid\");\nconst jobSearch = document.getElementById(\"jobSearch\");\nconst categoryFilter = document.getElementById(\"categoryFilter\");\nconst typeFilter = document.getElementById(\"typeFilter\");\nconst locationFilter = document.getElementById(\"locationFilter\");\nconst clearFilters = document.getElementById(\"clearFilters\");\nconst jobCount = document.getElementById(\"jobCount\");\nconst resultCount = document.getElementById(\"resultCount\");\n\n\n/* =========================================\n   SAFE HTML HELPER\n========================================= */\n\nfunction escapeHTML(value) {\n    return String(value ?? \"\").replace(/[&<>\"']/g, char => ({\n        \"&\": \"&amp;\",\n        \"<\": \"&lt;\",\n        \">\": \"&gt;\",\n        '\"': \"&quot;\",\n        \"'\": \"&#39;\"\n    })[char]);\n}\n\n\nfunction normalize(value) {\n    return String(value ?? \"\").trim().toLowerCase();\n}\n\n\n/* =========================================\n   LOAD JOBS\n========================================= */\n\nasync function loadJobs() {\n    try {\n        const response = await fetch(\"data/jobs.json\");\n\n        if (!response.ok) {\n            throw new Error(\"Unable to load jobs.json\");\n        }\n\n        const data = await response.json();\n\n        if (!Array.isArray(data)) {\n            throw new Error(\"Invalid jobs database format.\");\n        }\n\n        allJobs = data.filter(job => job && job.id);\n\n        filteredJobs = [...allJobs];\n\n        updateCounts();\n        renderJobs();\n\n    } catch (error) {\n        console.error(\"Job loading error:\", error);\n\n        if (jobsGrid) {\n            jobsGrid.innerHTML = `\n                <div class=\"jobs-empty\">\n                    <strong>DATABASE ERROR</strong>\n                    Unable to load job opportunities.\n                    Please open the project using VS Code Live Server.\n                </div>\n            `;\n        }\n\n        if (jobCount) jobCount.textContent = \"00\";\n        if (resultCount) resultCount.textContent = \"00 RESULTS\";\n    }\n}\n\n\n/* =========================================\n   RENDER JOBS\n========================================= */\n\nfunction renderJobs() {\n    if (!jobsGrid) return;\n\n    if (filteredJobs.length === 0) {\n        jobsGrid.innerHTML = `\n            <div class=\"jobs-empty\">\n                <strong>NO MATCHES FOUND</strong>\n                Try changing your search or filters.\n            </div>\n        `;\n        return;\n    }\n\n    jobsGrid.innerHTML = filteredJobs\n        .map(job => createJobCard(job))\n        .join(\"\");\n\n    attachJobEvents();\n}\n\n\n/* =========================================\n   CREATE JOB CARD\n========================================= */\n\nfunction createJobCard(job) {\n    const saved = isJobSaved(job.id);\n\n    const skills = (Array.isArray(job.skills) ? job.skills : [])\n        .map(skill => `\n            <span class=\"job-tag\">\n                ${escapeHTML(skill)}\n            </span>\n        `)\n        .join(\"\");\n\n    return `\n        <article class=\"job-card\" data-job-id=\"${escapeHTML(job.id)}\">\n\n            <div class=\"job-card-top\">\n\n                <div class=\"company-badge\">\n                    ${escapeHTML((job.company || \"?\").charAt(0).toUpperCase())}\n                </div>\n\n                <button\n                    class=\"save-job ${saved ? \"saved\" : \"\"}\"\n                    data-save-id=\"${escapeHTML(job.id)}\"\n                    aria-label=\"${saved ? \"Remove saved job\" : \"Save job\"}\"\n                    title=\"${saved ? \"Remove saved job\" : \"Save job\"}\"\n                    aria-pressed=\"${saved}\"\n                    type=\"button\"\n                >\n                    ${saved ? \"\u2605\" : \"\u2606\"}\n                </button>\n\n            </div>\n\n            <div class=\"job-company\">\n                ${escapeHTML(job.company || \"Company not specified\")}\n            </div>\n\n            <h2 class=\"job-title\">\n                ${escapeHTML(job.title || \"Untitled position\")}\n            </h2>\n\n            <p class=\"job-description\">\n                ${escapeHTML(job.description || \"No description available.\")}\n            </p>\n\n            <div class=\"job-meta\">\n\n                <span class=\"job-tag highlight\">\n                    ${escapeHTML(job.category || \"Other\")}\n                </span>\n\n                <span class=\"job-tag\">\n                    ${escapeHTML(job.type || \"Not specified\")}\n                </span>\n\n                <span class=\"job-tag\">\n                    ${escapeHTML(job.location || \"Not specified\")}\n                </span>\n\n                ${skills}\n\n            </div>\n\n            <div class=\"job-card-bottom\">\n\n                <span class=\"job-salary\">\n                    ${escapeHTML(job.salary || \"Salary not specified\")}\n                </span>\n\n                <a\n                    href=\"#apply?job=${encodeURIComponent(job.id)}\"\n                    class=\"view-job\"\n                >\n                    APPLY \u2192\n                </a>\n\n            </div>\n\n        </article>\n    `;\n}\n\n\n/* =========================================\n   SAVE / UNSAVE JOBS\n========================================= */\n\nfunction attachJobEvents() {\n    const saveButtons = document.querySelectorAll(\".save-job\");\n\n    saveButtons.forEach(button => {\n        button.addEventListener(\"click\", () => {\n            const jobId = button.dataset.saveId;\n\n            const saved = toggleSavedJob(jobId);\n\n            // Refresh from storage to reflect the actual state.\n            const isSaved = isJobSaved(jobId);\n\n            button.classList.toggle(\"saved\", isSaved);\n            button.textContent = isSaved ? \"\u2605\" : \"\u2606\";\n\n            button.setAttribute(\n                \"aria-label\",\n                isSaved ? \"Remove saved job\" : \"Save job\"\n            );\n\n            button.setAttribute(\n                \"title\",\n                isSaved ? \"Remove saved job\" : \"Save job\"\n            );\n\n            button.setAttribute(\"aria-pressed\", String(isSaved));\n\n            if (saved === isSaved) {\n                button.title = isSaved ? \"Remove saved job\" : \"Save job\";\n            }\n        });\n    });\n}\n\n\n/* =========================================\n   SEARCH + FILTER\n========================================= */\n\nfunction filterJobs() {\n    const searchTerm = normalize(jobSearch?.value);\n    const category = normalize(categoryFilter?.value);\n    const type = normalize(typeFilter?.value);\n    const location = normalize(locationFilter?.value);\n\n    filteredJobs = allJobs.filter(job => {\n        const skills = Array.isArray(job.skills) ? job.skills : [];\n\n        const searchableText = [\n            job.company,\n            job.title,\n            job.category,\n            job.type,\n            job.location,\n            job.description,\n            ...skills\n        ]\n            .map(normalize)\n            .join(\" \");\n\n        const matchesSearch =\n            !searchTerm || searchableText.includes(searchTerm);\n\n        const matchesCategory =\n            !category || category === \"all\" ||\n            normalize(job.category) === category;\n\n        const matchesType =\n            !type || type === \"all\" ||\n            normalize(job.type) === type;\n\n        const matchesLocation =\n            !location || location === \"all\" ||\n            normalize(job.location) === location;\n\n        return (\n            matchesSearch &&\n            matchesCategory &&\n            matchesType &&\n            matchesLocation\n        );\n    });\n\n    updateCounts();\n    renderJobs();\n}\n\n\n/* =========================================\n   COUNTERS\n========================================= */\n\nfunction updateCounts() {\n    const total = allJobs.length;\n    const results = filteredJobs.length;\n\n    if (jobCount) {\n        jobCount.textContent = String(total).padStart(2, \"0\");\n    }\n\n    if (resultCount) {\n        resultCount.textContent =\n            `${String(results).padStart(2, \"0\")} RESULTS`;\n    }\n}\n\n\n/* =========================================\n   CLEAR FILTERS\n========================================= */\n\nfunction resetFilters() {\n    if (jobSearch) jobSearch.value = \"\";\n    if (categoryFilter) categoryFilter.value = \"all\";\n    if (typeFilter) typeFilter.value = \"all\";\n    if (locationFilter) locationFilter.value = \"all\";\n\n    filteredJobs = [...allJobs];\n\n    updateCounts();\n    renderJobs();\n}\n\n\n/* =========================================\n   SEARCH EVENTS\n========================================= */\n\nif (jobSearch) {\n    jobSearch.addEventListener(\"input\", filterJobs);\n}\n\nif (categoryFilter) {\n    categoryFilter.addEventListener(\"change\", filterJobs);\n}\n\nif (typeFilter) {\n    typeFilter.addEventListener(\"change\", filterJobs);\n}\n\nif (locationFilter) {\n    locationFilter.addEventListener(\"change\", filterJobs);\n}\n\nif (clearFilters) {\n    clearFilters.addEventListener(\"click\", resetFilters);\n}\n\n\n/* =========================================\n   START\n========================================= */\n\nloadJobs();\n","applications":"\n/* =========================================\n   JOBTRACK \u2014 APPLICATION MANAGER\n   Script Shifters / K3P26RE\n========================================= */\n\n\n/* =========================================\n   CURRENT USER & DOM ELEMENTS\n========================================= */\n\nconst currentUser = getCurrentUser();\n\nconst applicationsList =\n    document.getElementById(\"applicationsList\");\n\nconst applicationCount =\n    document.getElementById(\"applicationCount\");\n\nconst resultCount =\n    document.getElementById(\"resultCount\");\n\nconst statusFilter =\n    document.getElementById(\"statusFilter\");\n\n\n/* =========================================\n   GLOBAL DATA\n========================================= */\n\nlet allApplications = [];\n\n\n/* =========================================\n   ALLOWED APPLICATION STATUSES\n========================================= */\n\nconst allowedStatuses = [\n    \"Applied\",\n    \"Assessment\",\n    \"Interview\",\n    \"Offer\",\n    \"Rejected\"\n];\n\n\n/* =========================================\n   SAFE HTML HELPER\n========================================= */\n\nfunction escapeHTML(value) {\n    return String(value ?? \"\").replace(/[&<>\"']/g, char => ({\n        \"&\": \"&amp;\",\n        \"<\": \"&lt;\",\n        \">\": \"&gt;\",\n        '\"': \"&quot;\",\n        \"'\": \"&#39;\"\n    })[char]);\n}\n\n\n/* =========================================\n   CHECK APPLICATION OWNERSHIP\n========================================= */\n\nfunction belongsToCurrentUser(application) {\n\n    if (!currentUser || !application) {\n        return false;\n    }\n\n    // New application records use userId.\n    if (application.userId) {\n        return application.userId === currentUser.id;\n    }\n\n    // Support older records using applicant email.\n    return (\n        application.applicantEmail &&\n        application.applicantEmail.toLowerCase() ===\n        currentUser.email.toLowerCase()\n    );\n}\n\n\n/* =========================================\n   LOAD APPLICATIONS\n========================================= */\n\nfunction loadApplications() {\n\n    if (!currentUser) {\n        window.location.href = \"#login\";\n        return;\n    }\n\n    const storedApplications = getApplications();\n\n    // Show only applications belonging to\n    // the currently signed-in user.\n    allApplications = storedApplications.filter(\n        belongsToCurrentUser\n    );\n\n    renderApplications();\n}\n\n\n/* =========================================\n   RENDER APPLICATIONS\n========================================= */\n\nfunction renderApplications() {\n\n    if (!applicationsList) return;\n\n    const selectedStatus = statusFilter\n        ? statusFilter.value\n        : \"all\";\n\n    let applications = [...allApplications];\n\n    // Filter by status, treating invalid statuses as Applied.\n    if (selectedStatus !== \"all\") {\n\n        applications = applications.filter(application =>\n            (allowedStatuses.includes(application.status)\n                ? application.status\n                : \"Applied\") === selectedStatus\n        );\n\n    }\n\n    // Newest applications first.\n    applications.sort((a, b) => {\n\n        const dateA = new Date(\n            a.createdAt || a.appliedDate || 0\n        );\n\n        const dateB = new Date(\n            b.createdAt || b.appliedDate || 0\n        );\n\n        return dateB - dateA;\n\n    });\n\n\n    // Update counters.\n    if (applicationCount) {\n\n        applicationCount.textContent =\n            String(allApplications.length).padStart(2, \"0\");\n\n    }\n\n    if (resultCount) {\n\n        resultCount.textContent =\n            `${String(applications.length).padStart(2, \"0\")} RESULTS`;\n\n    }\n\n\n    // Empty state.\n    if (applications.length === 0) {\n\n        applicationsList.innerHTML = `\n            <div class=\"applications-empty\">\n                <strong>\n                    ${selectedStatus === \"all\"\n                        ? \"NO APPLICATIONS YET\"\n                        : \"NO MATCHING APPLICATIONS\"}\n                </strong>\n                ${selectedStatus === \"all\"\n                    ? \"Apply to a job to create your first application record.\"\n                    : `No applications currently have the status \"${escapeHTML(selectedStatus)}\".`}\n            </div>\n        `;\n\n        return;\n    }\n\n\n    // Display application cards.\n    applicationsList.innerHTML = applications\n        .map(application => createApplicationCard(application))\n        .join(\"\");\n\n}\n\n\n/* =========================================\n   APPLICATION CARD\n========================================= */\n\nfunction createApplicationCard(application) {\n\n    const company = application.company || \"UNKNOWN\";\n\n    const role =\n        application.role ||\n        application.title ||\n        \"UNTITLED ROLE\";\n\n    const status = allowedStatuses.includes(application.status)\n        ? application.status\n        : \"Applied\";\n\n    const initial = company.charAt(0).toUpperCase();\n\n\n    // Format application date.\n    let date = \"NO DATE\";\n\n    if (application.appliedDate) {\n\n        const parsedDate = new Date(\n            application.appliedDate + \"T00:00:00\"\n        );\n\n        date = Number.isNaN(parsedDate.getTime())\n            ? \"NO DATE\"\n            : parsedDate.toLocaleDateString(\"en-IN\", {\n                day: \"2-digit\",\n                month: \"short\",\n                year: \"numeric\"\n            });\n\n    } else if (application.createdAt) {\n\n        const parsedDate = new Date(application.createdAt);\n\n        date = Number.isNaN(parsedDate.getTime())\n            ? \"NO DATE\"\n            : parsedDate.toLocaleDateString(\"en-IN\", {\n                day: \"2-digit\",\n                month: \"short\",\n                year: \"numeric\"\n            });\n\n    }\n\n\n    return `\n        <article class=\"application-card\">\n\n            <div class=\"application-company-icon\">\n                ${escapeHTML(initial)}\n            </div>\n\n            <div>\n\n                <div class=\"application-company\">\n                    ${escapeHTML(company)}\n                </div>\n\n                <div class=\"application-role\">\n                    ${escapeHTML(role)}\n                </div>\n\n            </div>\n\n            <div class=\"application-date\">\n                ${escapeHTML(date)}\n            </div>\n\n            <div class=\"application-status-wrap\">\n\n                <select\n                    class=\"application-status-select\"\n                    data-id=\"${escapeHTML(application.id)}\"\n                    aria-label=\"Update application status\"\n                >\n\n                    <option value=\"Applied\"\n                        ${status === \"Applied\" ? \"selected\" : \"\"}>\n                        APPLIED\n                    </option>\n\n                    <option value=\"Assessment\"\n                        ${status === \"Assessment\" ? \"selected\" : \"\"}>\n                        ASSESSMENT\n                    </option>\n\n                    <option value=\"Interview\"\n                        ${status === \"Interview\" ? \"selected\" : \"\"}>\n                        INTERVIEW\n                    </option>\n\n                    <option value=\"Offer\"\n                        ${status === \"Offer\" ? \"selected\" : \"\"}>\n                        OFFER\n                    </option>\n\n                    <option value=\"Rejected\"\n                        ${status === \"Rejected\" ? \"selected\" : \"\"}>\n                        REJECTED\n                    </option>\n\n                </select>\n\n            </div>\n\n        </article>\n    `;\n\n}\n\n\n/* =========================================\n   UPDATE APPLICATION STATUS\n========================================= */\n\nfunction updateApplicationStatus(applicationId, newStatus) {\n\n    if (!currentUser) {\n        window.location.href = \"#login\";\n        return;\n    }\n\n    if (!allowedStatuses.includes(newStatus)) {\n        return;\n    }\n\n    const applications = getApplications();\n\n    // Find the application belonging to this user.\n    // Supports both new and older application records.\n    const index = applications.findIndex(application =>\n\n        application.id === applicationId &&\n        belongsToCurrentUser(application)\n\n    );\n\n    // Do not modify another user's application.\n    if (index === -1) {\n        alert(\"Application record not found.\");\n        return;\n    }\n\n    const oldStatus = applications[index].status || \"Applied\";\n\n    if (oldStatus === newStatus) {\n        return;\n    }\n\n    // Update status and timestamp.\n    applications[index].status = newStatus;\n\n    applications[index].updatedAt =\n        new Date().toISOString();\n\n\n    // Save changes.\n    const saved = saveApplications(applications);\n\n    if (!saved) {\n        alert(\"Unable to save application status. Please try again.\");\n        loadApplications();\n        return;\n    }\n\n\n    // Record status change in activity log.\n    addActivity({\n\n        userId: currentUser.id,\n\n        type: \"status\",\n\n        message:\n            `Application for ${applications[index].role || applications[index].title || \"Untitled Role\"} at ${applications[index].company || \"Unknown Company\"} changed from ${oldStatus} to ${newStatus}.`\n\n    });\n\n\n    // Refresh displayed applications.\n    loadApplications();\n\n}\n\n\n/* =========================================\n   STATUS FILTER\n========================================= */\n\nif (statusFilter) {\n\n    statusFilter.addEventListener(\"change\", renderApplications);\n\n}\n\n\n/* =========================================\n   STATUS UPDATE EVENT\n========================================= */\n\nif (applicationsList) {\n\n    applicationsList.addEventListener(\"change\", event => {\n\n        if (\n            event.target.classList.contains(\n                \"application-status-select\"\n            )\n        ) {\n\n            const applicationId = event.target.dataset.id;\n\n            const newStatus = event.target.value;\n\n            updateApplicationStatus(\n                applicationId,\n                newStatus\n            );\n\n        }\n\n    });\n\n}\n\n\n/* =========================================\n   START APPLICATION MANAGER\n========================================= */\n\nloadApplications();\n","apply":"\n/* =========================================\n   JOBTRACK \u2014 APPLICATION FORM\n   Script Shifters / K3P26RE\n========================================= */\n\n\n/* =========================================\n   ELEMENTS\n========================================= */\n\nconst jobTitle = document.getElementById(\"jobTitle\");\nconst companyName = document.getElementById(\"companyName\");\nconst companyInitial = document.getElementById(\"companyInitial\");\n\nconst previewTitle = document.getElementById(\"previewTitle\");\nconst previewCategory = document.getElementById(\"previewCategory\");\nconst previewType = document.getElementById(\"previewType\");\nconst previewLocation = document.getElementById(\"previewLocation\");\n\nconst applicationForm = document.getElementById(\"applicationForm\");\nconst message = document.getElementById(\"applicationMessage\");\n\nconst applicantName = document.getElementById(\"applicantName\");\nconst applicantEmail = document.getElementById(\"applicantEmail\");\nconst appliedDate = document.getElementById(\"appliedDate\");\n\nconst applicationStatus = document.getElementById(\"applicationStatus\");\nconst applicationNotes = document.getElementById(\"applicationNotes\");\n\n\n/* =========================================\n   CURRENT USER\n========================================= */\n\nconst currentUser = getCurrentUser();\n\n\n/* =========================================\n   SELECTED JOB\n========================================= */\n\nlet selectedJob = null;\n\n\n/* =========================================\n   GET JOB ID FROM URL\n========================================= */\n\nconst params = new URLSearchParams(window.location.search);\nconst jobId = params.get(\"job\");\n\n\n/* =========================================\n   SET LOCAL DATE\n========================================= */\n\nfunction getTodayDate() {\n    const now = new Date();\n\n    const year = now.getFullYear();\n    const month = String(now.getMonth() + 1).padStart(2, \"0\");\n    const day = String(now.getDate()).padStart(2, \"0\");\n\n    return `${year}-${month}-${day}`;\n}\n\nif (appliedDate) {\n    appliedDate.value = getTodayDate();\n}\n\n// Set the latest permitted application date.\nif (appliedDate) {\n    appliedDate.max = getTodayDate();\n}\n\n// Pre-fill details of the logged-in student.\nif (currentUser) {\n    if (applicantName) {\n        applicantName.value = currentUser.name || \"\";\n    }\n\n    if (applicantEmail) {\n        applicantEmail.value = currentUser.email || \"\";\n    }\n}\n\n/* =========================================\n   LOAD SELECTED JOB\n========================================= */\n\nasync function loadSelectedJob() {\n\n    try {\n        if (!jobId) {\n            throw new Error(\"No job ID was provided.\");\n        }\n\n        const response = await fetch(\"data/jobs.json\");\n\n        if (!response.ok) {\n            throw new Error(\"Unable to load jobs database.\");\n        }\n\n        const jobs = await response.json();\n\n        if (!Array.isArray(jobs)) {\n            throw new Error(\"Invalid jobs database format.\");\n        }\n\n        selectedJob = jobs.find(job => String(job.id) === String(jobId));\n\n        if (!selectedJob) {\n            showError(\"ERROR / Job opportunity not found.\");\n            return;\n        }\n\n        populateJob();\n\n    } catch (error) {\n        console.error(\"Application loading error:\", error);\n        showError(\"ERROR / Unable to access opportunity database.\");\n    }\n}\n\n\n/* =========================================\n   POPULATE JOB DETAILS\n========================================= */\n\nfunction populateJob() {\n\n    const initial = (selectedJob.company || \"?\")\n        .charAt(0)\n        .toUpperCase();\n\n    if (companyInitial) {\n        companyInitial.textContent = initial;\n    }\n\n    if (companyName) {\n        companyName.textContent = selectedJob.company || \"\";\n    }\n\n    if (previewTitle) {\n        previewTitle.textContent = selectedJob.title || \"\";\n    }\n\n    if (jobTitle) {\n        jobTitle.textContent = (selectedJob.title || \"\").toUpperCase();\n    }\n\n    if (previewCategory) {\n        previewCategory.textContent =\n            (selectedJob.category || \"\").toUpperCase();\n    }\n\n    if (previewType) {\n        previewType.textContent =\n            (selectedJob.type || \"\").toUpperCase();\n    }\n\n    if (previewLocation) {\n        previewLocation.textContent =\n            (selectedJob.location || \"\").toUpperCase();\n    }\n\n}\n\n\n/* =========================================\n   DISPLAY ERROR / MESSAGE\n========================================= */\n\nfunction showError(text) {\n\n    if (!message) return;\n\n    message.textContent = text;\n    message.style.color = \"#ff6b9d\";\n}\n\n\n/* =========================================\n   SUBMIT APPLICATION\n========================================= */\n\nif (applicationForm) {\n\n    applicationForm.addEventListener(\"submit\", event => {\n\n        event.preventDefault();\n\n        if (!currentUser) {\n            showError(\"ERROR / Please log in before applying.\");\n            return;\n        }\n\n        if (!selectedJob) {\n            showError(\"ERROR / No job selected.\");\n            return;\n        }\n\n        const name = applicantName.value.trim();\n        const email = applicantEmail.value.trim();\n        const date = appliedDate.value;\n        const status = applicationStatus\n            ? applicationStatus.value\n            : \"Applied\";\n\n        const notes = applicationNotes\n            ? applicationNotes.value.trim()\n            : \"\";\n\n\n        /* =================================\n           VALIDATION\n        ================================= */\n\n        if (!name || !email || !date) {\n            showError(\"ERROR / Please complete all required fields.\");\n            return;\n        }\n\n        const emailPattern = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\n\n        if (!emailPattern.test(email)) {\n            showError(\"ERROR / Enter a valid email address.\");\n            return;\n        }\n\n        if (date > getTodayDate()) {\n            showError(\"ERROR / Application date cannot be in the future.\");\n            return;\n        }\n\n\n        /* =================================\n           PREVENT DOUBLE SUBMISSION\n        ================================= */\n\n        const submitButton =\n            applicationForm.querySelector('[type=\"submit\"]');\n\n        if (submitButton) {\n            submitButton.disabled = true;\n            submitButton.textContent = \"SUBMITTING...\";\n        }\n\n\n        /* =================================\n           CREATE APPLICATION\n        ================================= */\n\n        try {\n\n            const application = addApplication({\n\n                userId: currentUser.id,\n\n                jobId: selectedJob.id,\n                company: selectedJob.company,\n                role: selectedJob.title,\n                category: selectedJob.category,\n                type: selectedJob.type,\n                location: selectedJob.location,\n                salary: selectedJob.salary,\n\n                applicantName: name,\n                applicantEmail: email,\n\n                appliedDate: date,\n                status: status,\n                notes: notes\n\n            });\n\n\n            if (!application) {\n                throw new Error(\"Application could not be created.\");\n            }\n\n\n            /* =================================\n               RECORD ACTIVITY\n            ================================= */\n\n            addActivity({\n                userId: currentUser.id,\n                type: \"application\",\n                message: `${name} applied for ${selectedJob.title} at ${selectedJob.company}.`\n            });\n\n\n            /* =================================\n               SUCCESS\n            ================================= */\n\n            if (message) {\n                message.style.color = \"#9b6cff\";\n                message.textContent =\n                    \"APPLICATION SAVED / Redirecting...\";\n            }\n\n            setTimeout(() => {\n                window.location.href = \"#applications\";\n            }, 700);\n\n        } catch (error) {\n\n            console.error(\"Application submission error:\", error);\n\n            showError(\"ERROR / Application could not be saved.\");\n\n            if (submitButton) {\n                submitButton.disabled = false;\n                submitButton.textContent = \"SUBMIT APPLICATION\";\n            }\n\n        }\n\n    });\n\n}\n\n\n/* =========================================\n   START\n========================================= */\n\nloadSelectedJob();\n","saved":"/* Saved jobs page: shows jobs the user starred (ids in localStorage). */\ndocument.addEventListener(\"DOMContentLoaded\", async () => {\n    const list = document.getElementById(\"savedList\");\n    const render = (jobs) => {\n        const ids = getSavedJobs();\n        const mine = jobs.filter(j => ids.includes(j.id));\n        if (!mine.length) {\n            list.className = \"page-empty\";\n            list.innerHTML = 'No saved jobs yet. Star some on the <a href=\"#jobs\">Jobs page</a>.';\n            return;\n        }\n        list.className = \"page-grid\";\n        list.innerHTML = mine.map(j => `\n            <div class=\"page-card\">\n                <small>${j.type} / ${j.location}</small>\n                <h3>${j.title}</h3><span>${j.company}</span><small>${j.salary}</small>\n                <div class=\"row\">\n                    <a href=\"#apply?job=${j.id}\">APPLY</a>\n                    <button data-id=\"${j.id}\">REMOVE</button>\n                </div>\n            </div>`).join(\"\");\n        list.querySelectorAll(\"button\").forEach(b => b.addEventListener(\"click\", () => {\n            toggleSavedJob(b.dataset.id); render(jobs);\n        }));\n    };\n    try {\n        const res = await fetch(\"data/jobs.json\");\n        render(await res.json());\n    } catch (e) {\n        list.className = \"page-empty\";\n        list.textContent = \"Could not load jobs. Open the project with VS Code Live Server.\";\n    }\n});\n","profile":"\n/* =========================================\n   JOBTRACK \u2014 PROFILE MANAGEMENT\n   Script Shifters / K3P26RE\n========================================= */\n\ndocument.addEventListener(\"DOMContentLoaded\", () => {\n\n    const user = getCurrentUser();\n\n    if (!user) {\n        window.location.href = \"#login\";\n        return;\n    }\n\n    const $ = id => document.getElementById(id);\n\n    const form = $(\"profileForm\");\n    const message = $(\"pMsg\");\n\n    // Load the signed-in user's profile\n    const allProfiles = getStoredData(\n        STORAGE_KEYS.PROFILE,\n        {}\n    );\n\n    const profile = allProfiles[user.id] || {};\n\n    // Populate existing information\n    $(\"pName\").value = profile.name || user.name || \"\";\n    $(\"pEmail\").value = user.email || \"\";\n    $(\"pHeadline\").value = profile.headline || \"\";\n    $(\"pPhone\").value = profile.phone || \"\";\n    $(\"pLocation\").value = profile.location || \"\";\n    $(\"pProgramme\").value =\n        profile.programme || user.programme || \"\";\n\n    $(\"pSkills\").value =\n        (profile.skills || []).join(\", \");\n\n    $(\"pAbout\").value = profile.about || \"\";\n\n\n    // Save profile\n    form.addEventListener(\"submit\", event => {\n\n        event.preventDefault();\n\n        const updatedProfile = {\n\n            userId: user.id,\n\n            name: $(\"pName\").value.trim(),\n\n            email: user.email,\n\n            headline: $(\"pHeadline\").value.trim(),\n\n            phone: $(\"pPhone\").value.trim(),\n\n            location: $(\"pLocation\").value.trim(),\n\n            programme: $(\"pProgramme\").value.trim(),\n\n            skills: $(\"pSkills\").value\n                .split(\",\")\n                .map(skill => skill.trim())\n                .filter(Boolean),\n\n            about: $(\"pAbout\").value.trim(),\n\n            updatedAt: new Date().toISOString()\n\n        };\n\n\n        if (!updatedProfile.name) {\n\n            message.textContent = \"ERROR / Name is required.\";\n            return;\n\n        }\n\n\n        // Save profile separately for each user\n        allProfiles[user.id] = updatedProfile;\n\n        const saved = setStoredData(\n            STORAGE_KEYS.PROFILE,\n            allProfiles\n        );\n\n\n        if (saved) {\n\n            // Update the signed-in user's display name\n            const users = getUsers();\n\n            const userIndex = users.findIndex(\n                item => item.id === user.id\n            );\n\n            if (userIndex !== -1) {\n\n                users[userIndex].name = updatedProfile.name;\n                saveUsers(users);\n\n            }\n\n            const currentUser = {\n                ...user,\n                name: updatedProfile.name\n            };\n\n            setCurrentUser(currentUser);\n\n            addActivity({\n                userId: user.id,\n                type: \"profile\",\n                message: updatedProfile.name +\n                    \" updated their profile.\"\n            });\n\n            message.textContent =\n                \"SUCCESS / Profile saved successfully.\";\n\n        } else {\n\n            message.textContent =\n                \"ERROR / Could not save profile.\";\n\n        }\n\n    });\n\n});\n","admin":"\n/* =========================================\n   JOBTRACK \u2014 ADMIN DASHBOARD\n   Script Shifters / K3P26RE\n========================================= */\n\ndocument.addEventListener(\"DOMContentLoaded\", () => {\n\n    /* =================================\n       ADMIN ACCESS CONTROL\n    ================================= */\n\n    const user = getCurrentUser();\n\n    if (!user) {\n        window.location.href = \"#login\";\n        return;\n    }\n\n    if (user.role !== \"admin\") {\n        alert(\"Admin access only.\");\n        window.location.href = \"#dashboard\";\n        return;\n    }\n\n\n    /* =================================\n       LOAD SYSTEM DATA\n    ================================= */\n\n    const users = getUsers();\n    const activities = getActivities();\n    const applications = getApplications();\n    const totalSavedJobs = getTotalSavedJobs();\n\n    const pad = value =>\n        String(value).padStart(2, \"0\");\n\n\n    /* =================================\n       UPDATE ADMIN STATISTICS\n    ================================= */\n\n    function updateStat(elementId, value) {\n\n        const element = document.getElementById(elementId);\n\n        if (element) {\n            element.textContent = pad(value);\n        }\n\n    }\n\n    updateStat(\"aUsers\", users.length);\n    updateStat(\"aApps\", applications.length);\n    updateStat(\"aActs\", activities.length);\n    updateStat(\"aSaved\", totalSavedJobs);\n\n\n    /* =================================\n       REGISTERED USERS TABLE\n    ================================= */\n\n    const userRows = document.getElementById(\"userRows\");\n\n    if (userRows) {\n\n        userRows.replaceChildren();\n\n        if (users.length === 0) {\n\n            const row = document.createElement(\"tr\");\n            const cell = document.createElement(\"td\");\n\n            cell.colSpan = 4;\n            cell.textContent = \"No registered users found.\";\n\n            row.appendChild(cell);\n            userRows.appendChild(row);\n\n        } else {\n\n            users.forEach(registeredUser => {\n\n                const row = document.createElement(\"tr\");\n\n                const values = [\n                    registeredUser.name,\n                    registeredUser.email,\n                    registeredUser.role,\n                    registeredUser.programme || \"-\"\n                ];\n\n                values.forEach(value => {\n\n                    const cell = document.createElement(\"td\");\n\n                    cell.textContent = value || \"-\";\n\n                    row.appendChild(cell);\n\n                });\n\n                userRows.appendChild(row);\n\n            });\n\n        }\n\n    }\n\n\n    /* =================================\n       RECENT ACTIVITY\n    ================================= */\n\n    const actList = document.getElementById(\"actList\");\n\n    if (actList) {\n\n        actList.replaceChildren();\n\n        const recentActivities = [...activities]\n            .sort((a, b) =>\n                new Date(b.createdAt || 0) -\n                new Date(a.createdAt || 0)\n            )\n            .slice(0, 10);\n\n        if (recentActivities.length === 0) {\n\n            const item = document.createElement(\"li\");\n\n            item.textContent = \"No activity yet.\";\n\n            actList.appendChild(item);\n\n        } else {\n\n            recentActivities.forEach(activity => {\n\n                const item = document.createElement(\"li\");\n\n                const date = activity.createdAt\n                    ? new Date(activity.createdAt)\n                        .toLocaleString(\"en-IN\")\n                    : \"Date unavailable\";\n\n                item.textContent =\n                    `${date} \u2014 ${activity.message || \"Activity recorded\"}`;\n\n                actList.appendChild(item);\n\n            });\n\n        }\n\n    }\n\n});\n"};
const pageScript={index:['script'],login:['storage','auth'],register:['storage','register'],dashboard:['storage','guard','dashboard'],jobs:['storage','guard','jobs'],applications:['storage','guard','applications'],apply:['storage','guard','apply'],saved:['storage','guard','saved'],profile:['storage','guard','profile'],admin:['storage','guard','admin']};
let storageLoaded=false;
const nativeAddEventListener=document.addEventListener.bind(document);
document.addEventListener=function(type,listener,options){if(type==='DOMContentLoaded'){queueMicrotask(()=>listener.call(document,new Event('DOMContentLoaded')));return;}return nativeAddEventListener(type,listener,options);};
function loadScript(code, id){return new Promise(resolve=>{const s=document.createElement('script');s.textContent=(id==='storage'?code:'(()=>{\n'+code+'\n})();')+'\n//# sourceURL=jobtrack-'+id+'.js';s.onload=resolve;document.body.appendChild(s);resolve();});}
async function render(){let p=(location.hash||'#index').slice(1).split('?')[0];if(!PAGES[p])p='index';document.getElementById('app').innerHTML=PAGES[p];
// Rewire page links so all navigation stays inside this single file.
document.querySelectorAll('#app a[href]').forEach(a=>{let h=a.getAttribute('href');if(h&&h.endsWith('.html'))a.setAttribute('href','#'+h.replace('.html',''));});
for(const id of pageScript[p]){if(id==='storage'&&storageLoaded)continue;await loadScript(SCRIPTS[id],id);if(id==='storage')storageLoaded=true;}
}
window.addEventListener('hashchange',render);render();

/* =========================================
   PAGE
========================================= */

.jobs-page {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
}


/* =========================================
   MAIN AREA
========================================= */

.jobs-page .dashboard-main {
    min-height: 100vh;
    margin-left: 245px;
    padding: 0 42px 60px;
}


/* =========================================
   SIDEBAR
========================================= */

.jobs-page .dashboard-sidebar {
    position: fixed;
    top: 0;
    left: 0;

    width: 245px;
    height: 100vh;

    padding: 28px 18px;

    background:
        linear-gradient(
            180deg,
            rgba(12, 12, 17, 0.98),
            rgba(8, 8, 12, 0.98)
        );

    border-right: 1px solid var(--border);

    z-index: 100;
}


/* =========================================
   LOGO
========================================= */

.jobs-page .dashboard-logo {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 0 10px 32px;

    border-bottom: 1px solid var(--border);
}


.jobs-page .dashboard-logo-mark {
    width: 36px;
    height: 36px;

    display: grid;
    place-items: center;

    border: 1px solid var(--purple);

    color: var(--purple-bright);

    font-family: var(--font-mono);
    font-weight: 500;

    box-shadow:
        0 0 20px rgba(155, 108, 255, 0.15);
}


.jobs-page .dashboard-logo-text {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 1.5px;
}


.jobs-page .dashboard-logo-text span {
    color: var(--purple-bright);
}


/* =========================================
   NAVIGATION
========================================= */

.jobs-page .dashboard-nav {
    padding-top: 28px;
}


.jobs-page .nav-section-title {
    margin: 0 10px 12px;

    color: var(--text-muted);

    font-family: var(--font-mono);
    font-size: 9px;

    letter-spacing: 2px;
}


.jobs-page .dashboard-nav a {
    position: relative;

    display: flex;
    align-items: center;
    gap: 12px;

    padding: 13px 12px;
    margin-bottom: 4px;

    color: var(--text-soft);
    text-decoration: none;

    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.8px;

    border: 1px solid transparent;

    transition:
        color 0.2s ease,
        background 0.2s ease,
        border 0.2s ease;
}


.jobs-page .dashboard-nav a:hover {
    color: var(--white);

    background:
        rgba(155, 108, 255, 0.06);

    border-color:
        rgba(155, 108, 255, 0.18);
}


.jobs-page .dashboard-nav a.active {
    color: var(--purple-bright);

    background:
        rgba(155, 108, 255, 0.10);

    border-color:
        rgba(155, 108, 255, 0.25);
}


.jobs-page .dashboard-nav a.active::before {
    content: "";

    position: absolute;

    left: -1px;
    top: 8px;
    bottom: 8px;

    width: 2px;

    background: var(--purple-bright);

    box-shadow:
        0 0 12px var(--purple);
}


.jobs-page .nav-icon {
    width: 18px;

    text-align: center;

    color: var(--purple-bright);

    font-size: 14px;
}


.jobs-page .nav-divider {
    height: 1px;

    margin: 24px 10px;

    background: var(--border);
}


/* =========================================
   SIDEBAR BOTTOM
========================================= */

.jobs-page .sidebar-bottom {
    position: absolute;

    left: 18px;
    right: 18px;
    bottom: 24px;
}


.jobs-page .logout-button {
    width: 100%;

    padding: 12px;

    background: transparent;

    border: 1px solid var(--border);

    color: var(--text-muted);

    font-family: var(--font-mono);
    font-size: 10px;

    letter-spacing: 1px;

    cursor: pointer;

    transition: 0.2s ease;
}


.jobs-page .logout-button:hover {
    color: var(--purple-bright);

    border-color: var(--purple);

    background:
        rgba(155, 108, 255, 0.06);
}


/* =========================================
   TOP BAR
========================================= */

.jobs-page .dashboard-topbar {
    height: 82px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid var(--border);
}


.jobs-page .page-location {
    color: var(--text-muted);

    font-family: var(--font-mono);
    font-size: 10px;

    letter-spacing: 1.5px;
}


.jobs-page .system-indicator {
    display: flex;
    align-items: center;
    gap: 8px;

    color: var(--text-muted);

    font-family: var(--font-mono);
    font-size: 9px;

    letter-spacing: 1px;
}


.jobs-page .system-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--purple-bright);

    box-shadow:
        0 0 10px var(--purple);
}


/* =========================================
   PAGE INTRO
========================================= */

.jobs-intro {
    position: relative;

    display: flex;
    justify-content: space-between;
    align-items: flex-end;

    padding: 70px 0 48px;

    border-bottom: 1px solid var(--border);
}


.jobs-intro::before {
    content: "";

    position: absolute;

    width: 400px;
    height: 250px;

    top: 0;
    left: 0;

    background:
        radial-gradient(
            circle,
            rgba(155, 108, 255, 0.12),
            transparent 70%
        );

    pointer-events: none;
}


.jobs-intro .welcome-label {
    position: relative;

    display: block;

    margin-bottom: 16px;

    color: var(--purple-bright);

    font-family: var(--font-mono);
    font-size: 10px;

    letter-spacing: 2px;
}


.jobs-intro h1 {
    position: relative;

    margin: 0;

    font-family: var(--font-mono);

    font-size: clamp(42px, 6vw, 82px);

    line-height: 0.95;

    font-weight: 400;

    letter-spacing: -3px;

    text-transform: uppercase;
}


.jobs-intro h1 span {
    color: var(--purple-bright);

    text-shadow:
        0 0 30px rgba(155, 108, 255, 0.25);
}


.jobs-intro p {
    position: relative;

    max-width: 560px;

    margin: 24px 0 0;

    color: var(--text-muted);

    font-size: 14px;
    line-height: 1.7;
}


/* =========================================
   COUNTER
========================================= */

.jobs-counter {
    min-width: 150px;

    padding: 24px;

    text-align: right;

    border: 1px solid var(--border);

    background:
        rgba(255, 255, 255, 0.015);
}


.jobs-counter span,
.jobs-counter small {
    display: block;

    color: var(--text-muted);

    font-family: var(--font-mono);
    font-size: 8px;

    letter-spacing: 1.5px;
}


.jobs-counter strong {
    display: block;

    margin: 5px 0;

    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 42px;

    font-weight: 400;

    line-height: 1;

    text-shadow:
        0 0 20px rgba(155, 108, 255, 0.25);
}


/* =========================================
   SEARCH
========================================= */

.job-search-section {
    padding: 28px 0 18px;
}


.job-search-box {
    position: relative;

    display: flex;
    align-items: center;

    min-height: 64px;

    border: 1px solid var(--border);

    background:
        rgba(255, 255, 255, 0.018);

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}


.job-search-box:focus-within {
    border-color:
        rgba(155, 108, 255, 0.55);

    box-shadow:
        0 0 30px rgba(155, 108, 255, 0.06);
}


.search-icon {
    padding-left: 20px;

    color: var(--purple-bright);

    font-size: 24px;
}


.job-search-box input {
    flex: 1;

    height: 62px;

    padding: 0 18px;

    background: transparent;

    border: none;
    outline: none;

    color: var(--white);

    font-family: var(--font-mono);
    font-size: 12px;
}


.job-search-box input::placeholder {
    color: var(--text-muted);
}


.search-command {
    margin-right: 20px;

    color: var(--text-muted);

    font-family: var(--font-mono);
    font-size: 8px;

    letter-spacing: 1px;
}


/* =========================================
   FILTERS
========================================= */

.job-filters {
    display: grid;

    grid-template-columns:
        1fr
        1fr
        1fr
        auto;

    gap: 12px;

    padding-bottom: 38px;
}


.filter-group label {
    display: block;

    margin-bottom: 8px;

    color: var(--text-muted);

    font-family: var(--font-mono);
    font-size: 8px;

    letter-spacing: 1.5px;
}


.filter-group select {
    width: 100%;

    height: 44px;

    padding: 0 14px;

    background:
        rgba(255, 255, 255, 0.025);

    border: 1px solid var(--border);

    color: var(--text-soft);

    font-family: var(--font-mono);
    font-size: 10px;

    outline: none;

    cursor: pointer;
}


.filter-group select:focus {
    border-color: var(--purple);
}


.filter-group select option {
    background: #0c0c12;
    color: var(--white);
}


.clear-filters {
    align-self: end;

    height: 44px;

    padding: 0 20px;

    background: transparent;

    border: 1px solid var(--border);

    color: var(--text-muted);

    font-family: var(--font-mono);
    font-size: 8px;

    letter-spacing: 1px;

    cursor: pointer;

    transition: 0.2s ease;
}


.clear-filters:hover {
    color: var(--purple-bright);

    border-color: var(--purple);
}


/* =========================================
   JOBS SECTION
========================================= */

.jobs-section {
    padding-top: 8px;
}


.jobs-section-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding-bottom: 18px;

    border-bottom: 1px solid var(--border);
}


.jobs-result-count {
    color: var(--text-muted);

    font-family: var(--font-mono);
    font-size: 9px;

    letter-spacing: 1px;
}


/* =========================================
   JOB GRID
========================================= */

.jobs-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 14px;

    padding-top: 18px;
}


/* =========================================
   JOB CARD
========================================= */

.job-card {
    position: relative;

    padding: 26px;

    min-height: 270px;

    background:
        linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.035),
            rgba(255, 255, 255, 0.012)
        );

    border: 1px solid var(--border);

    overflow: hidden;

    transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease;
}


.job-card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--purple),
            transparent
        );

    opacity: 0;

    transition: opacity 0.25s ease;
}


.job-card:hover {
    transform: translateY(-3px);

    border-color:
        rgba(155, 108, 255, 0.4);

    background:
        linear-gradient(
            145deg,
            rgba(155, 108, 255, 0.055),
            rgba(255, 255, 255, 0.015)
        );
}


.job-card:hover::before {
    opacity: 1;
}


/* =========================================
   JOB CARD TOP
========================================= */

.job-card-top {
    display: flex;

    align-items: flex-start;
    justify-content: space-between;

    margin-bottom: 22px;
}


.company-badge {
    width: 46px;
    height: 46px;

    display: grid;
    place-items: center;

    background:
        rgba(155, 108, 255, 0.08);

    border: 1px solid
        rgba(155, 108, 255, 0.25);

    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 14px;
}


.save-job {
    width: 36px;
    height: 36px;

    display: grid;
    place-items: center;

    background: transparent;

    border: 1px solid var(--border);

    color: var(--text-muted);

    font-size: 18px;

    cursor: pointer;

    transition: 0.2s ease;
}


.save-job:hover,
.save-job.saved {
    color: var(--purple-bright);

    border-color: var(--purple);

    background:
        rgba(155, 108, 255, 0.08);
}


/* =========================================
   COMPANY + TITLE
========================================= */

.job-company {
    margin-bottom: 7px;

    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 10px;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}


.job-title {
    margin: 0;

    color: var(--white);

    font-family: var(--font-mono);

    font-size: 21px;

    line-height: 1.2;

    font-weight: 400;

    text-transform: uppercase;
}


.job-description {
    margin: 13px 0 20px;

    color: var(--text-muted);

    font-size: 12px;

    line-height: 1.65;

    max-width: 600px;
}


/* =========================================
   JOB META
========================================= */

.job-meta {
    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    margin-bottom: 20px;
}


.job-tag {
    padding: 6px 9px;

    border: 1px solid var(--border);

    color: var(--text-soft);

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: 0.7px;
}


.job-tag.highlight {
    color: var(--purple-bright);

    border-color:
        rgba(155, 108, 255, 0.25);

    background:
        rgba(155, 108, 255, 0.05);
}


/* =========================================
   JOB CARD BOTTOM
========================================= */

.job-card-bottom {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding-top: 18px;

    border-top: 1px solid var(--border);
}


.job-salary {
    color: var(--text-soft);

    font-family: var(--font-mono);

    font-size: 9px;
}


.view-job {
    padding: 10px 15px;

    background:
        var(--purple);

    border: 1px solid var(--purple);

    color: #08080c;

    font-family: var(--font-mono);

    font-size: 8px;

    font-weight: 500;

    letter-spacing: 1px;

    text-decoration: none;

    transition: 0.2s ease;
}


.view-job:hover {
    background:
        var(--purple-bright);

    box-shadow:
        0 0 22px rgba(155, 108, 255, 0.22);
}


/* =========================================
   LOADING / EMPTY
========================================= */

.jobs-loading,
.jobs-empty {
    grid-column: 1 / -1;

    padding: 70px 20px;

    text-align: center;

    border: 1px dashed var(--border);

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 10px;

    letter-spacing: 1.5px;
}


.jobs-empty strong {
    display: block;

    margin-bottom: 8px;

    color: var(--purple-bright);

    font-size: 13px;
}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 1050px) {

    .jobs-page .dashboard-main {
        padding-right: 25px;
        padding-left: 25px;
    }


    .jobs-grid {
        grid-template-columns: 1fr;
    }


    .job-filters {
        grid-template-columns:
            1fr 1fr;
    }


    .clear-filters {
        width: 100%;
    }

}


@media (max-width: 760px) {

    .jobs-page .dashboard-sidebar {
        position: relative;

        width: 100%;
        height: auto;

        padding: 18px;

        border-right: none;
        border-bottom: 1px solid var(--border);
    }


    .jobs-page .dashboard-nav {
        display: flex;

        gap: 5px;

        overflow-x: auto;

        padding-top: 18px;
    }


    .jobs-page .nav-section-title,
    .jobs-page .nav-divider,
    .jobs-page .sidebar-bottom {
        display: none;
    }


    .jobs-page .dashboard-nav a {
        flex: 0 0 auto;

        margin: 0;
    }


    .jobs-page .dashboard-main {
        margin-left: 0;

        padding:
            0 18px 40px;
    }


    .jobs-intro {
        flex-direction: column;

        align-items: flex-start;

        gap: 35px;

        padding-top: 45px;
    }


    .jobs-counter {
        width: 100%;

        text-align: left;
    }


    .job-filters {
        grid-template-columns: 1fr;
    }


    .jobs-page .dashboard-topbar {
        height: 65px;
    }

}


@media (max-width: 480px) {

    .jobs-intro h1 {
        font-size: 42px;

        letter-spacing: -2px;
    }


    .job-search-box {
        min-height: 58px;
    }


    .job-search-box input {
        height: 56px;

        font-size: 10px;
    }


    .search-command {
        display: none;
    }


    .job-card {
        padding: 20px;
    }


    .job-card-bottom {
        align-items: flex-end;

        gap: 15px;
    }

}
/* profile.css */
/* PROFILE PAGE */

.page-form {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
    max-width: 950px;
    margin: 30px 0 60px;
    padding: 30px;
    background: var(--surface, #15151f);
    border: 1px solid var(--border, #292938);
    border-radius: 14px;
}

.page-form label {
    display: flex;
    flex-direction: column;
    gap: 9px;
    color: var(--text-soft, #d0cede);
    font-family: var(--font-mono, monospace);
    font-size: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

.page-form input,
.page-form textarea {
    width: 100%;
    padding: 13px 14px;
    color: var(--white, #fff);
    background: #101019;
    border: 1px solid var(--border, #292938);
    border-radius: 7px;
    outline: none;
    font-family: inherit;
    font-size: 14px;
    text-transform: none;
    transition: border-color 0.2s ease;
}

.page-form input:focus,
.page-form textarea:focus {
    border-color: var(--purple, #8b5cf6);
}

.page-form input[readonly] {
    opacity: 0.6;
    cursor: not-allowed;
}

.page-form textarea {
    resize: vertical;
    min-height: 110px;
}

.page-form .wide {
    grid-column: 1 / -1;
}

.page-form .primary-button {
    margin-top: 5px;
}

.page-msg {
    display: inline-block;
    margin-left: 14px;
    font-size: 12px;
    color: #a78bfa;
}

@media (max-width: 650px) {
    .page-form {
        grid-template-columns: 1fr;
        padding: 20px;
    }

    .page-form .wide {
        grid-column: auto;
    }
}
/* dashboard.css */
/* =========================================
   JOBTRACK DASHBOARD
   Script Shifters / K3P26RE
========================================= */


/* =========================================
   DASHBOARD LAYOUT
========================================= */

.dashboard-page {

    min-height: 100vh;

    background: var(--bg);

    color: var(--text);

    overflow-x: hidden;

}


/* =========================================
   SIDEBAR
========================================= */

.dashboard-sidebar {

    position: fixed;

    top: 0;
    left: 0;

    width: 245px;
    height: 100vh;

    padding: 28px 18px;

    background: rgba(10, 10, 14, 0.96);

    border-right: 1px solid var(--border);

    z-index: 20;

    display: flex;

    flex-direction: column;

}


/* LOGO */

.dashboard-logo {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 0 10px;

    margin-bottom: 55px;

}


.dashboard-logo-mark {

    width: 32px;
    height: 32px;

    display: grid;

    place-items: center;

    border: 1px solid var(--purple);

    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 13px;

}


.dashboard-logo-text {

    font-size: 17px;

    font-weight: 800;

    letter-spacing: 2px;

}


.dashboard-logo-text span {

    color: var(--purple-bright);

}


/* =========================================
   NAVIGATION
========================================= */

.dashboard-nav {

    display: flex;

    flex-direction: column;

    gap: 5px;

}


.nav-section-title {

    padding: 0 12px;

    margin-bottom: 10px;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: 2px;

}


.dashboard-nav a {

    display: flex;

    align-items: center;

    gap: 13px;

    padding: 12px;

    color: var(--text-muted);

    text-decoration: none;

    font-size: 11px;

    font-family: var(--font-mono);

    letter-spacing: 0.5px;

    border: 1px solid transparent;

    transition: 0.25s ease;

}


.dashboard-nav a:hover {

    color: var(--text);

    background: rgba(155,108,255,0.05);

    border-color: var(--border);

}


.dashboard-nav a.active {

    color: var(--white);

    background: rgba(155,108,255,0.09);

    border-color: rgba(155,108,255,0.25);

}


.nav-icon {

    width: 20px;

    color: var(--purple-bright);

    font-size: 13px;

}


.nav-divider {

    height: 1px;

    background: var(--border);

    margin: 25px 10px;

}


/* =========================================
   SIDEBAR BOTTOM
========================================= */

.sidebar-bottom {

    margin-top: auto;

}


.logout-button {

    width: 100%;

    padding: 12px;

    border: 1px solid var(--border);

    background: transparent;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 9px;

    letter-spacing: 1px;

    cursor: pointer;

    transition: 0.25s ease;

}


.logout-button:hover {

    color: #ff6b9d;

    border-color: rgba(255,107,157,0.4);

    background: rgba(255,107,157,0.04);

}


/* =========================================
   MAIN CONTENT
========================================= */

.dashboard-main {

    margin-left: 245px;

    min-height: 100vh;

    padding: 35px 45px 60px;

    position: relative;

}


/* =========================================
   TOP BAR
========================================= */

.dashboard-topbar {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding-bottom: 28px;

    border-bottom: 1px solid var(--border);

}


.page-location {

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: 2px;

}


.topbar-right {

    display: flex;

    align-items: center;

    gap: 22px;

}


.system-indicator {

    display: flex;

    align-items: center;

    gap: 7px;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 8px;

}


.system-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #9b6cff;

    box-shadow: 0 0 10px #9b6cff;

}


/* =========================================
   WELCOME
========================================= */

.dashboard-welcome {

    padding: 55px 0 45px;

}


.welcome-label {

    display: block;

    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 9px;

    letter-spacing: 2px;

    margin-bottom: 14px;

}


.dashboard-welcome h1 {

    margin: 0;

    font-size: clamp(40px, 5vw, 68px);

    line-height: 0.95;

    letter-spacing: -3px;

}


.dashboard-welcome h1 span {

    color: transparent;

    -webkit-text-stroke: 1px rgba(255,255,255,0.4);

}


.dashboard-welcome p {

    margin-top: 20px;

    color: var(--text-muted);

    font-size: 12px;

}


/* =========================================
   STAT CARDS
========================================= */

.dashboard-stats {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;

}


.stat-card {

    position: relative;

    padding: 24px;

    min-height: 125px;

    background: rgba(255,255,255,0.015);

    border: 1px solid var(--border);

    transition: 0.25s ease;

}


.stat-card:hover {

    border-color: var(--border-bright);

    transform: translateY(-2px);

}


.stat-label {

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: 1.5px;

}


.stat-number {

    display: block;

    margin-top: 18px;

    color: var(--white);

    font-size: 38px;

    font-weight: 700;

    letter-spacing: -2px;

}


.stat-number span {

    color: var(--purple-bright);

}


.stat-index {

    position: absolute;

    top: 17px;

    right: 18px;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 8px;

}


/* =========================================
   CONTENT GRID
========================================= */

.dashboard-grid {

    display: grid;

    grid-template-columns: 1.5fr 0.8fr;

    gap: 15px;

    margin-top: 15px;

}


/* =========================================
   PANELS
========================================= */

.dashboard-panel {

    border: 1px solid var(--border);

    background: rgba(255,255,255,0.012);

}


.panel-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 20px 22px;

    border-bottom: 1px solid var(--border);

}


.panel-title {

    font-family: var(--font-mono);

    font-size: 9px;

    letter-spacing: 1.5px;

    color: var(--text);

}


.panel-action {

    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 8px;

    text-decoration: none;

}


.panel-action:hover {

    text-decoration: underline;

}


/* =========================================
   APPLICATION PIPELINE
========================================= */

.pipeline {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

}


.pipeline-item {

    padding: 25px 18px;

    border-right: 1px solid var(--border);

}


.pipeline-item:last-child {

    border-right: none;

}


.pipeline-number {

    display: block;

    font-size: 26px;

    font-weight: 700;

    margin-bottom: 7px;

}


.pipeline-label {

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 7px;

    letter-spacing: 1px;

}


/* =========================================
   APPLICATION LIST
========================================= */

.application-list {

    display: flex;

    flex-direction: column;

}


.application-row {

    display: grid;

    grid-template-columns: 1.2fr 1.3fr 0.7fr 0.6fr;

    gap: 15px;

    align-items: center;

    padding: 17px 22px;

    border-bottom: 1px solid rgba(255,255,255,0.05);

}


.application-row:last-child {

    border-bottom: none;

}


.company-name {

    font-weight: 600;

    font-size: 11px;

}


.job-title {

    color: var(--text-muted);

    font-size: 10px;

}


.application-date {

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 8px;

}


.status {

    width: fit-content;

    padding: 5px 8px;

    font-family: var(--font-mono);

    font-size: 7px;

    letter-spacing: 0.5px;

    border: 1px solid var(--border);

}


.status-applied {

    color: #9b6cff;

    border-color: rgba(155,108,255,0.35);

}


.status-interview {

    color: #f0c674;

    border-color: rgba(240,198,116,0.35);

}


.status-offer {

    color: #75e6a8;

    border-color: rgba(117,230,168,0.35);

}


.status-rejected {

    color: #ff6b9d;

    border-color: rgba(255,107,157,0.35);

}


/* =========================================
   ACTIVITY
========================================= */

.activity-list {

    padding: 5px 22px;

}


.activity-item {

    position: relative;

    padding: 18px 0 18px 22px;

    border-bottom: 1px solid rgba(255,255,255,0.05);

}


.activity-item:last-child {

    border-bottom: none;

}


.activity-item::before {

    content: "";

    position: absolute;

    left: 0;

    top: 23px;

    width: 7px;

    height: 7px;

    border: 1px solid var(--purple);

    border-radius: 50%;

    box-shadow: 0 0 8px rgba(155,108,255,0.5);

}


.activity-text {

    font-size: 10px;

    line-height: 1.5;

}


.activity-time {

    display: block;

    margin-top: 6px;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 7px;

}


/* =========================================
   QUICK ACTIONS
========================================= */

.quick-actions {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

    padding: 20px;

}


.quick-action {

    padding: 18px;

    border: 1px solid var(--border);

    color: var(--text-soft);

    text-decoration: none;

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: 1px;

    transition: 0.25s ease;

}


.quick-action:hover {

    color: var(--white);

    border-color: var(--purple);

    background: rgba(155,108,255,0.05);

}


/* =========================================
   EMPTY STATE
========================================= */

.empty-state {

    padding: 40px 20px;

    text-align: center;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: 1px;

}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 1100px) {

    .dashboard-stats {

        grid-template-columns:
            repeat(2, 1fr);

    }


    .dashboard-grid {

        grid-template-columns: 1fr;

    }

}


@media (max-width: 800px) {

    .dashboard-sidebar {

        position: relative;

        width: 100%;

        height: auto;

        border-right: none;

        border-bottom: 1px solid var(--border);

    }


    .dashboard-logo {

        margin-bottom: 25px;

    }


    .dashboard-nav {

        display: grid;

        grid-template-columns:
            repeat(3, 1fr);

    }


    .nav-section-title,
    .nav-divider {

        display: none;

    }


    .sidebar-bottom {

        margin-top: 20px;

    }


    .dashboard-main {

        margin-left: 0;

        padding: 25px 20px 50px;

    }

}


@media (max-width: 550px) {

    .dashboard-stats {

        grid-template-columns: 1fr;

    }


    .dashboard-welcome h1 {

        font-size: 44px;

    }


    .pipeline {

        grid-template-columns:
            repeat(2, 1fr);

    }


    .pipeline-item:nth-child(2) {

        border-right: none;

    }


    .pipeline-item:nth-child(-n+2) {

        border-bottom: 1px solid var(--border);

    }


    .application-row {

        grid-template-columns:
            1fr 1fr;

    }


    .application-date {

        display: none;

    }


    .dashboard-nav {

        grid-template-columns:
            repeat(2, 1fr);

    }

}

/* =========================================
   DASHBOARD — DYNAMIC APPLICATIONS
========================================= */

.application-item {

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;

    padding: 17px 22px;

    border-bottom: 1px solid rgba(255,255,255,0.05);

    transition: background 0.2s ease;

}

.application-item:last-child {
    border-bottom: none;
}

.application-item:hover {
    background: rgba(155,108,255,0.035);
}

.application-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
}

.application-info strong {
    color: var(--text);
    font-size: 11px;
    font-weight: 600;
}

.application-info span {
    color: var(--text-muted);
    font-size: 10px;
}

.application-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    flex-shrink: 0;
}

.application-status {
    padding: 5px 8px;

    color: var(--purple-bright);

    border: 1px solid rgba(155,108,255,0.35);

    font-family: var(--font-mono);
    font-size: 7px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

.application-meta small {
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 7px;
}


/* =========================================
   DASHBOARD — DYNAMIC ACTIVITY
========================================= */

.activity-message {
    display: block;

    color: var(--text-soft);

    font-size: 10px;
    line-height: 1.6;
}

.activity-item small {
    display: block;

    margin-top: 6px;

    color: var(--text-muted);

    font-family: var(--font-mono);
    font-size: 7px;
}


/* =========================================
   DYNAMIC EMPTY STATES
========================================= */

.application-list .empty-state,
.activity-list .empty-state {
    padding: 30px 20px;
}


/* =========================================
   MOBILE ADJUSTMENTS
========================================= */

@media (max-width: 550px) {

    .application-item {
        align-items: flex-start;
        padding: 15px;
    }

    .application-info strong {
        font-size: 10px;
    }

    .application-meta {
        text-align: right;
    }

}

/* pages.css */
/* Shared styles for saved / profile / admin pages (Script Shifters) */
.page-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:0 40px 40px}
.page-card{background:var(--surface);border:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:8px}
.page-card h3{font-size:1rem;margin:0}.page-card small{color:var(--text-soft);font-family:'DM Mono',monospace}
.page-card .row{display:flex;gap:10px;margin-top:auto;padding-top:10px}
.page-card a,.page-card button{background:transparent;color:var(--text);border:1px solid var(--border-bright);padding:8px 12px;font:inherit;font-size:.75rem;cursor:pointer;text-decoration:none}
.page-card a:hover,.page-card button:hover{border-color:var(--purple);color:var(--purple)}
.page-form{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 40px 40px;max-width:900px}
.page-form label{display:flex;flex-direction:column;gap:6px;font-size:.75rem;color:var(--text-soft);font-family:'DM Mono',monospace}
.page-form .wide{grid-column:1/-1}
.page-form input,.page-form textarea{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px;font:inherit}
.page-form input:focus,.page-form textarea:focus{outline:none;border-color:var(--purple)}
.page-msg{margin-left:14px;color:var(--purple);font-size:.8rem}
.table-wrap{overflow-x:auto}.page-table{width:100%;border-collapse:collapse;font-size:.85rem}
.page-table th,.page-table td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border)}
.page-table th{color:var(--text-muted);font-family:'DM Mono',monospace;font-size:.7rem}
.page-list{list-style:none;margin:0;padding:10px 20px}.page-list li{padding:8px 0;border-bottom:1px solid var(--border);color:var(--text-soft);font-size:.85rem}
.page-empty{padding:0 40px 40px;color:var(--text-soft)}
@media(max-width:700px){.page-form{grid-template-columns:1fr;padding:0 20px 30px}.page-grid{padding:0 20px 30px}}

/* applications.css */
/* =========================================
   JOBTRACK — APPLICATIONS
   Script Shifters / K3P26RE
========================================= */

.applications-page {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
}


/* =========================================
   MAIN
========================================= */

.applications-page .dashboard-main {
    min-height: 100vh;
    margin-left: 245px;
    padding: 0 42px 60px;
}


/* =========================================
   SIDEBAR
========================================= */

.applications-page .dashboard-sidebar {
    position: fixed;
    top: 0;
    left: 0;

    width: 245px;
    height: 100vh;

    padding: 28px 18px;

    background:
        linear-gradient(
            180deg,
            rgba(12, 12, 17, .98),
            rgba(8, 8, 12, .98)
        );

    border-right: 1px solid var(--border);

    z-index: 100;
}


.applications-page .dashboard-logo {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 0 10px 32px;

    border-bottom: 1px solid var(--border);
}


.applications-page .dashboard-logo-mark {
    width: 36px;
    height: 36px;

    display: grid;
    place-items: center;

    border: 1px solid var(--purple);

    color: var(--purple-bright);

    font-family: var(--font-mono);

    box-shadow:
        0 0 20px rgba(155,108,255,.15);
}


.applications-page .dashboard-logo-text {
    font-family: var(--font-mono);

    font-size: 14px;

    letter-spacing: 1.5px;
}


.applications-page .dashboard-logo-text span {
    color: var(--purple-bright);
}


/* =========================================
   NAV
========================================= */

.applications-page .dashboard-nav {
    padding-top: 28px;
}


.applications-page .nav-section-title {
    margin: 0 10px 12px;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 9px;

    letter-spacing: 2px;
}


.applications-page .dashboard-nav a {
    position: relative;

    display: flex;
    align-items: center;
    gap: 12px;

    padding: 13px 12px;
    margin-bottom: 4px;

    color: var(--text-soft);

    text-decoration: none;

    font-family: var(--font-mono);

    font-size: 11px;

    border: 1px solid transparent;

    transition: .2s ease;
}


.applications-page .dashboard-nav a:hover {
    color: var(--white);

    background:
        rgba(155,108,255,.06);

    border-color:
        rgba(155,108,255,.18);
}


.applications-page .dashboard-nav a.active {
    color: var(--purple-bright);

    background:
        rgba(155,108,255,.10);

    border-color:
        rgba(155,108,255,.25);
}


.applications-page .dashboard-nav a.active::before {
    content: "";

    position: absolute;

    left: -1px;
    top: 8px;
    bottom: 8px;

    width: 2px;

    background: var(--purple-bright);

    box-shadow:
        0 0 12px var(--purple);
}


.applications-page .nav-icon {
    width: 18px;

    text-align: center;

    color: var(--purple-bright);
}


.applications-page .nav-divider {
    height: 1px;

    margin: 24px 10px;

    background: var(--border);
}


/* =========================================
   LOGOUT
========================================= */

.applications-page .sidebar-bottom {
    position: absolute;

    left: 18px;
    right: 18px;
    bottom: 24px;
}


.applications-page .logout-button {
    width: 100%;

    padding: 12px;

    background: transparent;

    border: 1px solid var(--border);

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 10px;

    letter-spacing: 1px;

    cursor: pointer;

    transition: .2s ease;
}


.applications-page .logout-button:hover {
    color: var(--purple-bright);

    border-color: var(--purple);

    background:
        rgba(155,108,255,.06);
}


/* =========================================
   TOPBAR
========================================= */

.applications-page .dashboard-topbar {
    height: 82px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid var(--border);
}


.page-location {
    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 10px;

    letter-spacing: 1.5px;
}


.system-indicator {
    display: flex;
    align-items: center;
    gap: 8px;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 9px;
}


.system-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--purple-bright);

    box-shadow:
        0 0 10px var(--purple);
}


/* =========================================
   INTRO
========================================= */

.applications-intro {
    display: flex;

    justify-content: space-between;
    align-items: flex-end;

    padding: 70px 0 48px;

    border-bottom: 1px solid var(--border);
}


.welcome-label {
    display: block;

    margin-bottom: 16px;

    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 10px;

    letter-spacing: 2px;
}


.applications-intro h1 {
    margin: 0;

    font-family: var(--font-mono);

    font-size: clamp(42px, 6vw, 78px);

    line-height: .95;

    font-weight: 400;

    letter-spacing: -3px;
}


.applications-intro h1 span {
    color: var(--purple-bright);

    text-shadow:
        0 0 30px rgba(155,108,255,.25);
}


.applications-intro p {
    max-width: 560px;

    margin: 24px 0 0;

    color: var(--text-muted);

    font-size: 14px;

    line-height: 1.7;
}


/* =========================================
   COUNTER
========================================= */

.application-counter {
    min-width: 180px;

    padding: 24px;

    border: 1px solid var(--border);

    background:
        rgba(255,255,255,.015);
}


.application-counter span,
.application-counter small {
    display: block;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: 1.5px;
}


.application-counter strong {
    display: block;

    margin: 7px 0;

    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 46px;

    font-weight: 400;

    line-height: 1;
}


/* =========================================
   CONTROLS
========================================= */

.application-controls {
    display: flex;

    align-items: flex-end;
    justify-content: space-between;

    gap: 20px;

    padding: 28px 0;
}


.status-filter label {
    display: block;

    margin-bottom: 8px;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: 1.5px;
}


.status-filter select {
    width: 250px;

    height: 44px;

    padding: 0 14px;

    background:
        rgba(255,255,255,.025);

    border: 1px solid var(--border);

    color: var(--text-soft);

    font-family: var(--font-mono);

    font-size: 10px;

    outline: none;
}


.status-filter select option {
    background: #0c0c12;
    color: white;
}


.browse-jobs-button {
    padding: 14px 20px;

    background: var(--purple);

    border: 1px solid var(--purple);

    color: #08080c;

    text-decoration: none;

    font-family: var(--font-mono);

    font-size: 9px;

    letter-spacing: 1px;

    transition: .2s ease;
}


.browse-jobs-button:hover {
    background: var(--purple-bright);

    box-shadow:
        0 0 24px rgba(155,108,255,.2);
}


/* =========================================
   HEADER
========================================= */

.applications-header {
    display: flex;

    justify-content: space-between;

    padding: 18px 0;

    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 9px;

    letter-spacing: 1.2px;
}


/* =========================================
   APPLICATION LIST
========================================= */

.applications-list {
    display: flex;

    flex-direction: column;

    gap: 10px;

    padding-top: 16px;
}


/* =========================================
   APPLICATION CARD
========================================= */

.application-card {
    display: grid;

    grid-template-columns:
        55px
        1fr
        170px
        130px
        120px;

    align-items: center;

    gap: 20px;

    padding: 22px;

    border: 1px solid var(--border);

    background:
        rgba(255,255,255,.018);

    transition: .2s ease;
}


.application-card:hover {
    border-color:
        rgba(155,108,255,.35);

    background:
        rgba(155,108,255,.035);
}


.application-company-icon {
    width: 44px;
    height: 44px;

    display: grid;
    place-items: center;

    border: 1px solid
        rgba(155,108,255,.25);

    color: var(--purple-bright);

    font-family: var(--font-mono);

    background:
        rgba(155,108,255,.07);
}


.application-company {
    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 9px;

    letter-spacing: 1px;
}


.application-role {
    margin-top: 6px;

    color: var(--white);

    font-family: var(--font-mono);

    font-size: 15px;
}


.application-date {
    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 9px;
}


.application-status {
    justify-self: start;

    padding: 8px 11px;

    border: 1px solid var(--border);

    color: var(--text-soft);

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: .8px;
}


.application-status.applied {
    color: var(--purple-bright);

    border-color:
        rgba(155,108,255,.3);

    background:
        rgba(155,108,255,.06);
}


.application-status.interview {
    color: #ffffff;

    border-color:
        rgba(255,255,255,.3);
}


.application-status.offer {
    color: var(--purple-bright);

    border-color: var(--purple);

    box-shadow:
        0 0 15px rgba(155,108,255,.1);
}


.application-status.rejected {
    color: var(--text-muted);

    opacity: .7;
}


/* =========================================
   EMPTY STATE
========================================= */

.applications-empty {
    padding: 80px 20px;

    text-align: center;

    border: 1px dashed var(--border);

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 10px;

    letter-spacing: 1px;
}


.applications-empty strong {
    display: block;

    margin-bottom: 10px;

    color: var(--purple-bright);

    font-size: 13px;
}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 1050px) {

    .applications-page .dashboard-main {
        padding-left: 25px;
        padding-right: 25px;
    }


    .application-card {
        grid-template-columns:
            50px
            1fr
            130px;
    }


    .application-date {
        display: none;
    }

}


@media (max-width: 760px) {

    .applications-page .dashboard-sidebar {
        position: relative;

        width: 100%;
        height: auto;

        padding: 18px;

        border-right: none;
        border-bottom: 1px solid var(--border);
    }


    .applications-page .dashboard-nav {
        display: flex;

        gap: 5px;

        overflow-x: auto;

        padding-top: 18px;
    }


    .applications-page .nav-section-title,
    .applications-page .nav-divider,
    .applications-page .sidebar-bottom {
        display: none;
    }


    .applications-page .dashboard-nav a {
        flex: 0 0 auto;
    }


    .applications-page .dashboard-main {
        margin-left: 0;

        padding:
            0 18px 40px;
    }


    .applications-intro {
        flex-direction: column;

        align-items: flex-start;

        gap: 30px;

        padding-top: 45px;
    }


    .application-counter {
        width: 100%;
    }


    .application-controls {
        align-items: stretch;

        flex-direction: column;
    }


    .status-filter select {
        width: 100%;
    }


    .browse-jobs-button {
        text-align: center;
    }


    .application-card {
        grid-template-columns:
            45px
            1fr;
    }


    .application-status {
        grid-column: 2;
    }

}


@media (max-width: 480px) {

    .applications-intro h1 {
        font-size: 42px;
    }

}
/* =========================================
   APPLICATION STATUS SELECT
========================================= */

.application-status-wrap {
    display: flex;
    align-items: center;
}

.application-status-select {
    appearance: none;
    -webkit-appearance: none;

    background: rgba(155, 108, 255, 0.08);

    border: 1px solid var(--border-bright);

    color: var(--text);

    padding: 9px 34px 9px 13px;

    border-radius: 6px;

    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;

    letter-spacing: 0.08em;

    cursor: pointer;

    outline: none;

    transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}

.application-status-select:hover {
    border-color: var(--purple);
    background: rgba(155, 108, 255, 0.14);
}

.application-status-select:focus {
    border-color: var(--purple-bright);

    box-shadow:
        0 0 0 3px rgba(155, 108, 255, 0.1),
        0 0 20px rgba(155, 108, 255, 0.12);
}

.application-status-select option {
    background: #111015;
    color: #ffffff;
}
.status-assessment {
    color: var(--purple);
}
/* apply.css */
/* =========================================
   JOBTRACK — APPLICATION FORM
   Script Shifters / K3P26RE
========================================= */

.apply-page {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 75% 20%,
            rgba(155,108,255,.09),
            transparent 30%
        ),
        var(--bg);

    color: var(--text);
}


/* =========================================
   HEADER
========================================= */

.apply-header {
    height: 78px;

    padding: 0 42px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid var(--border);
}


.back-link {
    color: var(--text-muted);

    text-decoration: none;

    font-family: var(--font-mono);

    font-size: 9px;

    letter-spacing: 1px;

    transition: .2s ease;
}


.back-link:hover {
    color: var(--purple-bright);
}


.apply-logo {
    display: flex;

    align-items: center;

    gap: 10px;

    color: var(--white);

    font-family: var(--font-mono);

    font-size: 13px;

    letter-spacing: 1.5px;
}


.apply-logo span span {
    color: var(--purple-bright);
}


.logo-mark {
    width: 32px;
    height: 32px;

    display: grid;
    place-items: center;

    border: 1px solid var(--purple);

    color: var(--purple-bright);
}


.system-status {
    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: 1px;
}


.system-status::first-letter {
    color: var(--purple-bright);
}


/* =========================================
   CONTAINER
========================================= */

.apply-container {
    width: min(950px, calc(100% - 40px));

    margin: 0 auto;

    padding: 70px 0 90px;
}


.apply-label {
    margin-bottom: 15px;

    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 9px;

    letter-spacing: 2px;
}


.apply-container h1 {
    margin: 0;

    color: var(--white);

    font-family: var(--font-mono);

    font-size: clamp(42px, 7vw, 78px);

    line-height: .95;

    font-weight: 400;

    letter-spacing: -3px;
}


.apply-container h1 span {
    color: var(--purple-bright);

    text-shadow:
        0 0 30px rgba(155,108,255,.25);
}


.apply-intro {
    max-width: 600px;

    margin: 22px 0 42px;

    color: var(--text-muted);

    font-size: 13px;

    line-height: 1.7;
}


/* =========================================
   JOB PREVIEW
========================================= */

.job-preview {
    display: flex;

    align-items: center;

    gap: 20px;

    padding: 24px;

    margin-bottom: 18px;

    border: 1px solid var(--border);

    background:
        rgba(255,255,255,.018);
}


.company-symbol {
    width: 58px;
    height: 58px;

    flex-shrink: 0;

    display: grid;
    place-items: center;

    border: 1px solid
        rgba(155,108,255,.35);

    background:
        rgba(155,108,255,.08);

    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 20px;
}


.preview-company {
    display: block;

    margin-bottom: 7px;

    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 9px;

    letter-spacing: 1.5px;
}


.job-preview h2 {
    margin: 0;

    color: var(--white);

    font-family: var(--font-mono);

    font-size: 20px;

    font-weight: 400;
}


.preview-meta {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 12px;
}


.preview-meta span {
    padding: 6px 9px;

    border: 1px solid var(--border);

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: .5px;
}


/* =========================================
   FORM
========================================= */

.application-form {
    padding: 30px;

    border: 1px solid var(--border);

    background:
        rgba(255,255,255,.012);
}


.form-heading {
    margin-bottom: 26px;

    padding-bottom: 16px;

    border-bottom: 1px solid var(--border);

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 9px;

    letter-spacing: 1.5px;
}


.form-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 22px 18px;
}


.form-group label {
    display: block;

    margin-bottom: 9px;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: 1.4px;
}


.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;

    box-sizing: border-box;

    padding: 13px 14px;

    background:
        rgba(255,255,255,.02);

    border: 1px solid var(--border);

    outline: none;

    color: var(--white);

    font-family: var(--font-mono);

    font-size: 10px;

    transition: .2s ease;
}


.form-group input,
.form-group select {
    height: 46px;
}


.form-group textarea {
    resize: vertical;

    min-height: 120px;

    line-height: 1.6;
}


.form-group input::placeholder,
.form-group textarea::placeholder {
    color: var(--text-muted);
}


.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color:
        rgba(155,108,255,.55);

    box-shadow:
        0 0 20px rgba(155,108,255,.05);
}


.form-group select option {
    background: #0c0c12;

    color: white;
}


.full-width {
    grid-column: 1 / -1;
}


/* =========================================
   MESSAGE
========================================= */

.application-message {
    min-height: 20px;

    margin-top: 20px;

    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 9px;

    letter-spacing: .8px;
}


/* =========================================
   FOOTER BUTTONS
========================================= */

.form-footer {
    display: flex;

    justify-content: flex-end;

    align-items: center;

    gap: 12px;

    margin-top: 10px;

    padding-top: 22px;

    border-top: 1px solid var(--border);
}


.cancel-button,
.submit-application {
    height: 46px;

    padding: 0 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 15px;

    font-family: var(--font-mono);

    font-size: 9px;

    letter-spacing: 1px;

    text-decoration: none;

    cursor: pointer;

    transition: .2s ease;
}


.cancel-button {
    color: var(--text-muted);

    border: 1px solid var(--border);

    background: transparent;
}


.cancel-button:hover {
    color: var(--white);

    border-color: var(--text-muted);
}


.submit-application {
    color: #08080c;

    background: var(--purple);

    border: 1px solid var(--purple);
}


.submit-application:hover {
    background: var(--purple-bright);

    box-shadow:
        0 0 25px rgba(155,108,255,.22);
}


.submit-application span {
    font-size: 16px;
}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 700px) {

    .apply-header {
        padding: 0 18px;
    }


    .system-status {
        display: none;
    }


    .apply-container {
        width: min(
            100% - 30px,
            950px
        );

        padding-top: 45px;
    }


    .apply-container h1 {
        font-size: 43px;
    }


    .form-grid {
        grid-template-columns: 1fr;
    }


    .full-width {
        grid-column: auto;
    }


    .application-form {
        padding: 20px;
    }


    .form-footer {
        flex-direction: column-reverse;

        align-items: stretch;
    }


    .cancel-button,
    .submit-application {
        width: 100%;
    }

}


@media (max-width: 480px) {

    .job-preview {
        align-items: flex-start;

        padding: 18px;
    }


    .company-symbol {
        width: 45px;
        height: 45px;
    }


    .job-preview h2 {
        font-size: 15px;
    }

}
/* APPLICATION FORM — SMALL FIXES */

.form-group input:disabled,
.form-group select:disabled,
.submit-application:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.application-message:empty {
    display: none;
}

.application-message:not(:empty) {
    padding: 10px 12px;
    border-left: 2px solid var(--purple);
    background: rgba(155,108,255,.06);
}
/* login.css */
/* =========================================
   JOBTRACK LOGIN PAGE
========================================= */


/* =========================================
   AUTH PAGE
========================================= */

.auth-page {
    min-height: 100vh;

    background: #08080a;

    position: relative;

    overflow-x: hidden;
}


/* =========================================
   BACKGROUND
========================================= */

.auth-background {
    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 0;
}


.auth-grid {
    position: absolute;

    inset: 0;

    opacity: 0.25;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.035) 1px,
            transparent 1px
        );

    background-size: 50px 50px;

    mask-image:
        radial-gradient(
            circle at center,
            black,
            transparent 75%
        );
}


.auth-glow {
    position: absolute;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    background: #9b6cff;

    filter: blur(150px);

    opacity: 0.055;
}


.glow-one {
    top: -250px;
    right: -100px;
}


.glow-two {
    bottom: -300px;
    left: -150px;
}


.background-line {
    position: absolute;

    height: 1px;

    width: 500px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(155,108,255,0.3),
            transparent
        );

    opacity: 0.5;
}


.line-one {
    top: 25%;

    right: -120px;

    transform: rotate(-25deg);
}


.line-two {
    bottom: 20%;

    left: -120px;

    transform: rotate(25deg);
}


/* =========================================
   HEADER
========================================= */

.auth-header {
    position: relative;

    z-index: 5;

    height: 82px;

    padding: 0 6vw;

    display: flex;

    align-items: center;

    justify-content: space-between;

    border-bottom: 1px solid var(--border);

    background:
        rgba(8,8,10,0.65);

    backdrop-filter: blur(18px);
}


.system-status {
    display: flex;

    align-items: center;

    gap: 9px;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: 2px;
}


/* =========================================
   MAIN AUTH AREA
========================================= */

.auth-container {
    min-height: calc(100vh - 145px);

    padding: 80px 8vw;

    position: relative;

    z-index: 2;

    display: grid;

    grid-template-columns: 1fr 480px;

    gap: 100px;

    align-items: center;
}


/* =========================================
   LEFT INTRO
========================================= */

.auth-intro {
    position: relative;

    min-height: 550px;

    display: flex;

    flex-direction: column;

    justify-content: center;
}


.auth-code {
    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 9px;

    letter-spacing: 3px;

    margin-bottom: 25px;
}


.auth-intro h1 {
    font-size: clamp(60px, 8vw, 110px);

    line-height: 0.88;

    letter-spacing: -5px;

    margin-bottom: 35px;

    font-weight: 800;
}


.auth-intro h1 span {
    color: transparent;

    -webkit-text-stroke: 1px rgba(255,255,255,0.45);
}


.auth-intro > p {
    max-width: 470px;

    color: var(--text-soft);

    font-size: 14px;

    line-height: 1.8;
}


/* =========================================
   DECORATION
========================================= */

.auth-decoration {
    position: absolute;

    right: 5%;

    bottom: 0;

    width: 230px;

    height: 230px;

    display: grid;

    place-items: center;
}


.decoration-ring {
    position: absolute;

    border-radius: 50%;

    border: 1px solid rgba(155,108,255,0.25);
}


.ring-a {
    width: 100px;
    height: 100px;
}


.ring-b {
    width: 165px;
    height: 165px;

    border-style: dashed;
}


.ring-c {
    width: 225px;
    height: 225px;

    opacity: 0.5;
}


.decoration-center {
    width: 70px;
    height: 70px;

    display: grid;

    place-items: center;

    border-radius: 50%;

    border: 1px solid var(--purple);

    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 24px;

    background:
        radial-gradient(
            circle,
            rgba(155,108,255,0.15),
            #0d0d10
        );

    box-shadow:
        0 0 35px rgba(155,108,255,0.12);
}


.auth-meta {
    position: absolute;

    bottom: 10px;
    left: 0;

    display: flex;

    gap: 25px;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 7px;

    letter-spacing: 1px;
}


/* =========================================
   LOGIN CARD
========================================= */

.auth-card {
    position: relative;

    padding: 42px;

    background:
        rgba(15,15,19,0.88);

    border: 1px solid var(--border-bright);

    box-shadow:
        0 30px 80px rgba(0,0,0,0.45);

    backdrop-filter: blur(25px);
}


.auth-card::before {
    content: "";

    position: absolute;

    top: -1px;
    left: 25px;

    width: 70px;
    height: 1px;

    background: var(--purple);

    box-shadow:
        0 0 15px var(--purple);
}


/* =========================================
   CARD HEADER
========================================= */

.card-header {
    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    margin-bottom: 40px;
}


.card-label {
    display: block;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 7px;

    letter-spacing: 2px;

    margin-bottom: 10px;
}


.card-header h2 {
    font-size: 30px;

    letter-spacing: -1px;
}


.card-number {
    color: var(--purple);

    font-family: var(--font-mono);

    font-size: 10px;
}


/* =========================================
   FORM
========================================= */

.input-group {
    margin-bottom: 24px;
}


.input-group label {
    display: block;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: 1.5px;

    margin-bottom: 9px;
}


.input-wrapper {
    height: 52px;

    display: flex;

    align-items: center;

    border: 1px solid var(--border);

    background: rgba(255,255,255,0.025);

    transition: 0.25s ease;
}


.input-wrapper:focus-within {
    border-color: rgba(155,108,255,0.65);

    box-shadow:
        0 0 25px rgba(155,108,255,0.07);
}


.input-icon {
    width: 45px;

    display: grid;

    place-items: center;

    color: var(--purple);

    font-family: var(--font-mono);

    font-size: 14px;
}


.input-wrapper input {
    flex: 1;

    height: 100%;

    border: none;

    outline: none;

    background: transparent;

    color: var(--text);

    font-size: 13px;
}


.input-wrapper input::placeholder {
    color: #55535d;
}


.password-label {
    display: flex;

    justify-content: space-between;

    align-items: center;
}


.password-label label {
    margin-bottom: 9px;
}


.forgot-link {
    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 7px;

    letter-spacing: 0.5px;

    transition: 0.2s ease;
}


.forgot-link:hover {
    color: var(--purple-bright);
}


.password-toggle {
    margin-right: 12px;

    padding: 5px 7px;

    border: 1px solid var(--border);

    background: transparent;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 7px;

    cursor: pointer;

    transition: 0.2s ease;
}


.password-toggle:hover {
    color: var(--purple-bright);

    border-color: rgba(155,108,255,0.4);
}


/* =========================================
   REMEMBER
========================================= */

.remember-row {
    margin: 5px 0 25px;
}


.remember {
    display: flex;

    align-items: center;

    gap: 9px;

    color: var(--text-muted);

    font-size: 11px;

    cursor: pointer;
}


.remember input {
    display: none;
}


.custom-checkbox {
    width: 15px;
    height: 15px;

    border: 1px solid var(--border-bright);

    position: relative;

    transition: 0.2s ease;
}


.remember input:checked + .custom-checkbox {
    border-color: var(--purple);

    background: var(--purple);
}


.remember input:checked + .custom-checkbox::after {
    content: "✓";

    position: absolute;

    inset: 0;

    display: grid;

    place-items: center;

    color: #08080a;

    font-size: 10px;

    font-weight: 800;
}


/* =========================================
   MESSAGE
========================================= */

.form-message {
    min-height: 18px;

    margin-bottom: 10px;

    color: #ff6b9d;

    font-family: var(--font-mono);

    font-size: 8px;

    letter-spacing: 0.5px;
}


/* =========================================
   SUBMIT BUTTON
========================================= */

.auth-submit {
    width: 100%;

    height: 54px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 20px;

    border: 1px solid var(--purple);

    background: var(--purple);

    color: #08080a;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 1px;

    cursor: pointer;

    transition: 0.3s ease;
}


.auth-submit:hover {
    background: var(--purple-bright);

    box-shadow:
        0 0 35px rgba(155,108,255,0.2);
}


.submit-arrow {
    font-size: 18px;

    transition: 0.3s ease;
}


.auth-submit:hover .submit-arrow {
    transform: translateX(5px);
}


/* =========================================
   DIVIDER
========================================= */

.auth-divider {
    display: grid;

    grid-template-columns: 1fr auto 1fr;

    align-items: center;

    gap: 12px;

    margin: 30px 0 20px;
}


.auth-divider span {
    height: 1px;

    background: var(--border);
}


.auth-divider small {
    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 6px;

    letter-spacing: 1.5px;
}


/* =========================================
   REGISTER
========================================= */

.register-link {
    height: 48px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 15px;

    border: 1px solid var(--border);

    color: var(--text-soft);

    font-size: 11px;

    transition: 0.25s ease;
}


.register-link span {
    color: var(--purple-bright);

    font-size: 16px;
}


.register-link:hover {
    color: var(--white);

    border-color: rgba(155,108,255,0.45);

    background: rgba(155,108,255,0.04);
}


/* =========================================
   SECURITY
========================================= */

.security-note {
    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 25px;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 7px;

    line-height: 1.5;
}


.security-note span {
    color: var(--purple);
}


/* =========================================
   FOOTER
========================================= */

.auth-footer {
    position: relative;

    z-index: 3;

    min-height: 63px;

    padding: 0 6vw;

    display: flex;

    align-items: center;

    justify-content: space-between;

    border-top: 1px solid var(--border);

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 7px;

    letter-spacing: 1px;
}


.auth-footer a {
    color: var(--text-muted);

    transition: 0.2s ease;
}


.auth-footer a:hover {
    color: var(--purple-bright);
}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 1000px) {

    .auth-container {
        grid-template-columns: 1fr;

        gap: 50px;

        padding: 70px 7vw;
    }


    .auth-intro {
        min-height: auto;

        text-align: center;

        align-items: center;
    }


    .auth-intro > p {
        max-width: 550px;
    }


    .auth-decoration {
        display: none;
    }


    .auth-meta {
        position: static;

        margin-top: 30px;
    }


    .auth-card {
        width: min(100%, 500px);

        margin: auto;
    }

}


@media (max-width: 600px) {

    .auth-header {
        padding: 0 5vw;
    }


    .system-status {
        display: none;
    }


    .auth-container {
        padding: 55px 5vw;
    }


    .auth-intro h1 {
        font-size: 65px;

        letter-spacing: -3px;
    }


    .auth-card {
        padding: 28px 22px;
    }


    .auth-footer {

/* register.css */
/* =========================================
   JOBTRACK REGISTRATION PAGE
========================================= */


/* =========================================
   CONTAINER
========================================= */

.register-container {

    min-height: calc(100vh - 145px);

    padding: 70px 8vw;

    position: relative;

    z-index: 2;

    display: grid;

    grid-template-columns: 1fr 560px;

    gap: 100px;

    align-items: center;

}


/* =========================================
   INTRO
========================================= */

.register-intro {

    display: flex;

    flex-direction: column;

    justify-content: center;

}


.register-intro h1 {

    font-size: clamp(55px, 7vw, 100px);

    line-height: 0.9;

    letter-spacing: -5px;

    margin-bottom: 32px;

}


.register-intro h1 span {

    color: transparent;

    -webkit-text-stroke: 1px rgba(255,255,255,0.42);

}


.register-intro > p {

    max-width: 500px;

    color: var(--text-soft);

    font-size: 14px;

    line-height: 1.8;

}


/* =========================================
   REGISTRATION STATS
========================================= */

.register-stats {

    display: flex;

    gap: 1px;

    margin-top: 60px;

    border: 1px solid var(--border);

    width: fit-content;

}


.register-stat {

    min-width: 120px;

    padding: 17px;

    background: rgba(255,255,255,0.015);

    border-right: 1px solid var(--border);

}


.register-stat:last-child {

    border-right: none;

}


.register-stat strong {

    display: block;

    color: var(--purple-bright);

    font-family: var(--font-mono);

    font-size: 16px;

    margin-bottom: 7px;

}


.register-stat span {

    display: block;

    color: var(--text-muted);

    font-family: var(--font-mono);

    font-size: 6px;

    line-height: 1.5;

    letter-spacing: 1px;

}


/* =========================================
   REGISTER CARD
========================================= */

.register-card {

    position: relative;

    padding: 40px;

    background: rgba(15,15,19,0.9);

    border: 1px solid var(--border-bright);

    box-shadow: 0 30px 80px rgba(0,0,0,0.45);

    backdrop-filter: blur(25px);

}


.register-card::before {

    content: "";

    position: absolute;

    top: -1px;

    left: 25px;

    width: 85px;

    height: 1px;

    background: var(--purple);

    box-shadow: 0 0 15px var(--purple);

}


/* =========================================
   FORM ROW
========================================= */

.form-row {

    display: grid;

    grid-template-columns: 1fr 0.7fr;

    gap: 12px;

}


/* =========================================
   SELECT
========================================= */

.input-wrapper select {

    flex: 1;

    height: 100%;

    min-width: 0;

    border: none;

    outline: none;

    background: transparent;

    color: var(--text);

    font-size: 12px;

    cursor: pointer;

}


.input-wrapper select option {

    background: #111116;

    color: var(--text);

}


/* =========================================
   TERMS
========================================= */

.terms {

    display: flex;

    align-items: flex-start;

    gap: 10px;

    color: var(--text-muted);

    font-size: 10px;

    line-height: 1.5;

    cursor: pointer;

    margin: 5px 0 20px;

}


.terms input {

    display: none;

}


.terms .custom-checkbox {

    flex-shrink: 0;

    margin-top: 1px;

}


.terms input:checked + .custom-checkbox {

    border-color: var(--purple);

    background: var(--purple);

}


.terms input:checked + .custom-checkbox::after {

    content: "✓";

    position: absolute;

    inset: 0;

    display: grid;

    place-items: center;

    color: #08080a;

    font-size: 9px;

    font-weight: 800;

}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 1100px) {

    .register-container {

        grid-template-columns: 1fr;

        gap: 55px;

        padding: 70px 7vw;

    }


    .register-intro {

        text-align: center;

        align-items: center;

    }


    .register-intro > p {

        max-width: 600px;

    }


    .register-stats {

        margin-top: 35px;

    }


    .register-card {

        width: min(100%, 600px);

        margin: auto;

    }

}


@media (max-width: 600px) {

    .register-container {

        padding: 50px 5vw;

    }


    .register-intro h1 {

        font-size: 58px;

        letter-spacing: -3px;

    }


    .register-stats {

        width: 100%;

        display: grid;

        grid-template-columns: repeat(3, 1fr);

    }


    .register-stat {

        min-width: 0;

        padding: 13px 8px;

    }


    .register-card {

        padding: 27px 20px;

    }


    .form-row {

        grid-template-columns: 1fr;

        gap: 0;

    }

}
